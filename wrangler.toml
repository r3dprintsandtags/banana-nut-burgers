name = "banana-nut-burgers"
pages_build_output_dir = "."
compatibility_date = "2026-10-20"

# D1 database for booking requests (CRM).
# 1) npx wrangler d1 create banana-nut-burgers-db
# 2) Paste the returned database_id below (replacing the placeholder).
# 3) npx wrangler d1 execute banana-nut-burgers-db --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "banana-nut-burgers-db"
database_id = "c9aae575-c976-47f7-90b1-f52077b0cec1"

# Private R2 bucket for signed registration documents + signature images.
# Create once (after login):  npx wrangler r2 bucket create banana-nut-burgers-docs
# Never make this bucket public; files are only served via authenticated /api routes.
[[r2_buckets]]
binding = "DOCS"
bucket_name = "banana-nut-burgers-docs"
