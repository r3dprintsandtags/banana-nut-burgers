ferred new date",cancelSend:"Send request",cancelOk:"We received your request. The dive shop will follow up with you.",cancelNeed:"Please complete every required field.",shopTitle:"Who Are These Crazy Banana Nut Burgers?",shopBody:"We're the dive shop you'll end up telling your friends about for years.\n\nBanana Nut Burgers sits right on the sand between West End and West Bay, and our shop is attached to a beach bar that looks like a postcard. Hammocks, cold drinks, warm water, and a crowd that actually wants to hang out. It's far enough from the busy strip that you can breathe, and close enough that the party is a short walk away. Spend your surface interval in the sun. Come back after sunset and dance by the fire. Either way, you'll feel like one of us by day two.\n\nAnd the diving? It starts at our front door. The legendary Blue Channel is right in front of the shop, and honestly, it's our backyard. We know it the way you know your own street.\n\nWhen you want to go farther, we take you where most people never get to. Day trips to Utila, Guanaja, Cayos Cochinos, and the Pigeon Keys. Quiet reefs. Untouched walls. Abandoned keys with no other boats in sight.\n\nMost dive shops send you out and bring you back. We make you part of the crew.\n\nCome dive Roatan the way it's meant to be done.",reqTitle:"Registration Requirements",reqBody:"Certified divers\n- Bring your certification card (PADI, SSI, NAUI or equivalent) or digital proof. We cannot take you out without it.\n- Open Water certification or higher is required.\n- If it has been more than 12 months since your last dive, tell us. We may recommend a refresher.\n\nNew to diving\n- No certification needed for Discover Scuba. You will get a safety briefing and hands-on training before you go to the reef.\n- You must be in reasonable physical health and complete a medical questionnaire.\n\nAge requirements\n- Minimum age for Discover Scuba and Junior Open Water is 12.\n- Divers ages 12 to 14 dive within junior depth limits.\n- Divers ages 15 to 17 are limited to 70 feet unless certified for deeper.\n- Anyone under 18 must have a parent or guardian sign the waiver and release forms."},
es:{h1:"Bucea. Ríe. <b>Repite.</b>",sub:"Buceo en grupos pequeños, tours por la isla y fogatas al atardecer en Tita's Pink Seahorse Bar, West End.",bookNow:"Reservar y registrarse",ciH:"Reservar Mi Buceo",ciP:"Elige actividad y horario, completa formularios y screening médico, y firma. Un solo envío reserva tu lugar y te registra en la tienda. Sin crear cuenta.",ciStart:"Reservar Mi Buceo",ciResume:"Terminar o Actualizar Mi Registro",ciInfo:"Informacion del Centro de Buceo",ciContact:"Contactar la tienda",ciReq:"Requisitos de Registro",ciPriv:"Privacidad: tu información y documentos firmados se guardan de forma privada y solo los ve el personal autorizado de Banana Nut Burger.",expH:"Elige tu aventura",expS:"Toca una para reservar y registrarte.",s1:"especies de peces",s2:"especies de coral",s3:"por grupo",galH:"Roatán de cerca",galS:"Momentos reales de nuestros buceos y tours.",bookH:"Reservar y registrarse",bookS:"Actividad, fecha, formularios y firma — todo en un solo flujo. Confirmamos por WhatsApp o correo.",bookOne:"Tu reserva y registro van juntos. Elige una aventura arriba o empieza abajo: fecha y hora, datos del buzo, formularios y una firma.",bookOneNote:"Al terminar, tu cita aparece en Reservas y tu papeleo en Registros.",findH:"Encuéntranos",findD:"West End, Roatán. En Tita's Pink Seahorse Bar, a pasos de la playa.",dir:"Cómo llegar",pill:"WEST END · ROATÁN",svc:[["gear","Scuba","¿Nunca has buceado? Empieza aquí."],["crew","Buceos y cursos","Certificación hasta Divemaster."],["snork","Snorkel","Arrecifes con guía."]],close:"Cerrar",sendEmail:"Enviar correo",sendWa:"Enviar un mensaje por WhatsApp",cancelBtn:"Cancelar o Reprogramar",resNum:"Número de reserva",phoneNum:"Teléfono",fullName:"Nombre completo",choice:"¿Qué quieres hacer?",cancelOpt:"Cancelar",reschedOpt:"Reprogramar",newDate:"Fecha nueva preferida",cancelSend:"Enviar solicitud",cancelOk:"Recibimos tu solicitud. El centro de buceo te contactará.",cancelNeed:"Completa todos los campos obligatorios.",shopTitle:"¿Quiénes son estos locos Banana Nut Burgers?",shopBody:"Somos el centro de buceo del que les vas a hablar a tus amigos durante años.\n\nBanana Nut Burgers está sobre la arena, entre West End y West Bay, y la tienda está pegada a un bar de playa que parece una postal. Hamacas, bebidas frías, agua tibia y gente que de verdad quiere quedarse. Está lo bastante lejos del tramo lleno para que puedas respirar, y lo bastante cerca para que la fiesta quede a un corto paseo. Pasa tu intervalo de superficie al sol. Vuelve después del atardecer y baila junto al fuego. De una forma u otra, al segundo día vas a sentirte uno de nosotros.\n\n¿Y el buceo? Empieza en nuestra puerta. El legendario Blue Channel está justo frente a la tienda, y la verdad es nuestro patio. Lo conocemos como tú conoces tu propia calle.\n\nCuando quieres ir más lejos, te llevamos adonde la mayoría nunca llega. Viajes de un día a Utila, Guanaja, Cayos Cochinos y los Pigeon Keys. Arrecifes quietos. Paredes intactas. Cayos abandonados sin otros botes a la vista.\n\nLa mayoría de los centros te sacan y te regresan. Nosotros te hacemos parte de la tripulación.\n\nVen a bucear Roatán como se debe.",reqTitle:"Requisitos de Registro",reqBody:"Buzos certificados\n- Trae tu tarjeta de certificación (PADI, SSI, NAUI o equivalente) o una prueba digital. No podemos llevarte al agua sin ella.\n- Se requiere certificación Open Water o superior.\n- Si han pasado más de 12 meses desde tu último buceo, dínoslo. Podemos recomendarte un repaso.\n\nSi empiezas a bucear\n- Discover Scuba no requiere certificación. Recibirás una charla de seguridad y práctica antes de ir al arrecife.\n- Debes estar en un estado físico razonable y completar un cuestionario médico.\n\nEdades\n- La edad mínima para Discover Scuba y Junior Open Water es 12 años.\n- Los buzos de 12 a 14 años bucean dentro de los límites de profundidad junior.\n- Los buzos de 15 a 17 años están limitados a 70 pies, salvo que estén certificados para más profundidad.\n- Quien tenga menos de 18 años necesita que un padre o tutor firme los formularios de exención y liberación."}
};
let L=(navigator.language||"en").startsWith("es")?"es":"en";
const $=i=>document.getElementById(i),PH="50498763374";
try{const saved=localStorage.getItem("bnb_lang");if(saved==="en"||saved==="es")L=saved}catch(e){}
function goRegister(activity){
  const q=new URLSearchParams({start:"1"});
  if(activity)q.set("activity",activity);
  location.href="register.html?"+q.toString();
}
function render(){
  const t=T[L];
  document.documentElement.lang=L;
  document.title=L==="es"
    ? "Banana Nut Burgers Dive Shop · West End, Roatán"
    : "Banana Nut Burgers Dive Shop · West End, Roatán";
  $("lang").textContent=L==="en"?"ES":"EN";
  document.querySelectorAll("[data-i]").forEach(e=>{if(t[e.dataset.i]!==undefined)e.textContent=t[e.dataset.i]});
  document.querySelector("[data-h]").innerHTML=t.h1;
  $("svc").innerHTML="";
  t.svc.forEach((s,i)=>{
    const c=document.createElement("div");
    c.className="sv";
    c.innerHTML=`<img alt=""><div><h3></h3><p></p></div>`;
    c.querySelector("img").src=IMG[s[0]];
    c.querySelector("h3").textContent=s[1];
    c.querySelector("p").textContent=s[2];
    c.onclick=()=>goRegister(ACTS[i]);
    $("svc").append(c);
  });
  const u="https://wa.me/"+PH+"?text="+encodeURIComponent(L==="es"?"Hola Banana Nut Burgers, quiero información de buceo.":"Hi Banana Nut Burgers, I'd like info about diving.");
  $("wa").href=u;$("wa2").href=u;
}
$("lang").onclick=()=>{L=L==="en"?"es":"en";try{localStorage.setItem("bnb_lang",L)}catch(e){}render();paintPromos();if($("sheet").style.display==="flex")paintSheet();};
window.addEventListener("storage",(ev)=>{
  if(ev.key!=="bnb_lang") return;
  if(ev.newValue!=="en"&&ev.newValue!=="es") return;
  if(ev.newValue===L) return;
  L=ev.newValue; render(); paintPromos();
});
document.querySelectorAll(".mos img").forEach(i=>i.onclick=()=>{$("lb").firstElementChild.src=i.src;$("lb").style.display="flex"});
$("lb").onclick=()=>$("lb").style.display="none";
let promos=[];
function pickPromoText(p, enKey, esKey){
  if(L==="es") return (p[esKey]||p[enKey]||"").trim();
  return (p[enKey]||"").trim();
}
function paintPromos(){
  const p=promos[0];
  const bar=$("promoBar"), wrap=$("promoWrap");
  if(!p){
    bar.hidden=true; bar.style.display="none";
    wrap.hidden=true; wrap.style.display="none";
    return;
  }
  const title=pickPromoText(p,"title","titleEs");
  const blurb=pickPromoText(p,"blurb","blurbEs");
  const badge=pickPromoText(p,"badge","badgeEs")||(L==="es"?"ESPECIAL DE LA SEMANA":"THIS WEEK'S SPECIAL");
  const cta=pickPromoText(p,"ctaLabel","ctaLabelEs")||(L==="es"?"RESERVAR OFERTA":"BOOK THIS DEAL");
  const ends=pickPromoText(p,"endsLabel","endsLabelEs")||(p.endsAt?((L==="es"?"TERMINA ":"ENDS ")+p.endsAt):"");
  const url=p.ctaUrl||"register.html?start=1";
  bar.hidden=false; bar.style.display="flex";
  $("promoBarBadge").textContent=L==="es"?"TIEMPO LIMITADO":"LIMITED TIME";
  $("promoBarMsg").textContent=title;
  $("promoBarCta").textContent=cta;
  $("promoBarCta").href=url;
  wrap.hidden=false; wrap.style.display="block";
  $("promoPill").textContent=badge;
  $("promoLim").textContent=L==="es"?"TIEMPO LIMITADO":"LIMITED TIME";
  $("promoTitle").textContent=title;
  $("promoBlurb").textContent=blurb;
  $("promoEnds").hidden=!ends;
  $("promoEnds").textContent=ends;
  $("promoCta").textContent=cta;
  $("promoCta").href=url;
}
async function loadPromos(){
  try{
    const d=await (await fetch("/api/promotions")).json();
    promos=Array.isArray(d.promotions)?d.promotions:[];
  }catch(e){ promos=[]; }
  paintPromos();
}

let sheetKind = "";
function paintSheet(){
  const t = T[L];
  $("sheetLang").textContent = L === "en" ? "ES" : "EN";
  $("sheetClose").textContent = t.close;
  if (sheetKind === "shop") { $("sheetTitle").textContent = t.shopTitle; $("sheetBody").textContent = t.shopBody; }
  else if (sheetKind === "req") { $("sheetTitle").textContent = t.reqTitle; $("sheetBody").textContent = t.reqBody; }
  else if (sheetKind === "cancel") {
    const keep = { n: $("crNum").value, p: $("crPhone").value, f: $("crName").value, d: $("crDate").value, k: (document.querySelector('input[name="crKind"]:checked') || {}).value };
    $("sheetTitle").textContent = t.cancelBtn;
    $("sheetForm").innerHTML = cancelForm();
    bindCancel();
    $("crNum").value = keep.n; $("crPhone").value = keep.p; $("crName").value = keep.f; $("crDate").value = keep.d;
    if (keep.k) { const r = document.querySelector('input[name="crKind"][value="' + keep.k + '"]'); if (r) { r.checked = true; $("crDateWrap").classList.toggle("hide", keep.k !== "reschedule"); } }
    if (!$("sheetOk").classList.contains("hide")) $("sheetOk").textContent = t.cancelOk;
  }
}
function openSheet(title, body, formHtml){
  $("sheetLang").textContent = L === "en" ? "ES" : "EN";
  $("sheetTitle").textContent = title;
  $("sheetBody").textContent = body || "";
  $("sheetBody").style.display = body ? "block" : "none";
  $("sheetForm").classList.toggle("hide", !formHtml);
  $("sheetForm").innerHTML = formHtml || "";
  $("sheetOk").classList.add("hide");
  $("sheetErr").textContent = "";
  $("sheet").style.display = "flex";
  $("sheetClose").textContent = T[L].close;
}
function closeSheet(){ $("sheet").style.display = "none"; $("sheetForm").innerHTML = ""; sheetKind = ""; }
$("sheetLang").onclick = () => $("lang").click();
$("sheetClose").onclick = closeSheet;
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) closeSheet(); });
$("openShopInfo").onclick = () => { sheetKind = "shop"; openSheet(T[L].shopTitle, T[L].shopBody, ""); };
$("openReq").onclick = () => { sheetKind = "req"; openSheet(T[L].reqTitle, T[L].reqBody, ""); };
$("contactBtn").onclick = () => { $("contactMenu").classList.toggle("hide"); };
document.addEventListener("click", (e) => {
  if (!$("contactMenu") || $("contactMenu").classList.contains("hide")) return;
  if (e.target.closest("#contactBtn") || e.target.closest("#contactMenu")) return;
  $("contactMenu").classList.add("hide");
});
function cancelForm(){
  const t = T[L];
  return `<label>${t.resNum}</label><input id="crNum" autocomplete="off">
<label>${t.phoneNum}</label><input id="crPhone" type="tel" inputmode="tel">
<label>${t.fullName}</label><input id="crName" autocomplete="name">
<label>${t.choice}</label>
<div class="yesno" style="display:flex;gap:12px;flex-wrap:wrap">
<label class="chk"><input type="radio" name="crKind" value="cancel"> ${t.cancelOpt}</label>
<label class="chk"><input type="radio" name="crKind" value="reschedule"> ${t.reschedOpt}</label>
</div>
<div id="crDateWrap" class="hide"><label>${t.newDate}</label><input id="crDate" type="date"></div>
<p><button type="button" id="crSend">${t.cancelSend}</button></p>`;
}
function bindCancel(){
  const sync = () => {
    const kind = (document.querySelector('input[name="crKind"]:checked') || {}).value;
    $("crDateWrap").classList.toggle("hide", kind !== "reschedule");
  };
  document.querySelectorAll('input[name="crKind"]').forEach(r => r.onchange = sync);
  $("crSend").onclick = async () => {
    const t = T[L];
    const kind = (document.querySelector('input[name="crKind"]:checked') || {}).value || "";
    const payload = { reservationNumber: $("crNum").value.trim(), phone: $("crPhone").value.trim(), fullName: $("crName").value.trim(), kind, preferredDate: $("crDate") ? $("crDate").value : "" };
    if (!payload.reservationNumber || !payload.phone || !payload.fullName || !kind || (kind === "reschedule" && !payload.preferredDate)) {
      $("sheetErr").textContent = t.cancelNeed; return;
    }
    $("sheetErr").textContent = "";
    $("crSend").disabled = true;
    try {
      const r = await fetch("/api/schedule-requests", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || t.cancelNeed);
      $("sheetForm").classList.add("hide");
      $("sheetOk").textContent = t.cancelOk;
      $("sheetOk").classList.remove("hide");
    } catch (e) {
      $("sheetErr").textContent = e.message || t.cancelNeed;
      $("crSend").disabled = false;
    }
  };
}
$("openCancel").onclick = () => { sheetKind = "cancel"; openSheet(T[L].cancelBtn, "", cancelForm()); bindCancel(); };

render();
loadPromos();
if(location.hash==="#book"||location.hash==="#checkin")setTimeout(()=>$("checkin").scrollIntoView(),50);
</script></body></html>
