.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,20,30,.05) 25%,rgba(3,20,30,.78))}
.hero .wrap{position:relative;padding-bottom:28px;width:100%}
.hero svg{width:104px;height:104px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.hero h1{font-size:clamp(34px,9vw,58px);line-height:1;margin:8px 0;letter-spacing:-.03em}.hero h1 b{color:var(--ban)}
.hero p{margin:0 0 16px;max-width:480px;opacity:.92}
.cta{display:flex;gap:10px;flex-wrap:wrap}.wa{background:#1fa855}.ban{background:var(--ban);color:#2a1b00}
.glass{background:rgba(255,255,255,.92);color:#0a2533}
.tag{display:inline-block;background:var(--ban);color:#2a1b00;font-weight:800;font-size:12px;padding:4px 12px;border-radius:99px;letter-spacing:.04em}
section{padding:30px 0}h2{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}.sub{color:var(--mut);margin:0 0 14px}
.snap{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 14px;margin:0 -16px}
.sv{flex:0 0 72%;max-width:280px;scroll-snap-align:start;border-radius:20px;overflow:hidden;position:relative;background:var(--card);border:1px solid var(--line);cursor:pointer}
.sv img{width:100%;height:190px;object-fit:cover;display:block}.sv div{padding:12px 14px}.sv h3{margin:0;font-size:17px}.sv p{margin:2px 0 0;font-size:14px;color:var(--mut)}
.sv.on{outline:3px solid var(--ban)}
.mos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;cursor:zoom-in}.mos .w{grid-column:span 2;grid-row:span 2}
.band{background:linear-gradient(135deg,#0a86b0,#075a78);color:#fff;border-radius:22px;padding:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.band b{font-size:26px;color:var(--ban);display:block;line-height:1.1}.band span{font-size:13px;opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:48px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.note{font-size:13px;color:var(--mut)}.ok{color:var(--ok);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:99px;min-height:40px;padding:8px 14px}.chip[aria-pressed="true"]{background:var(--ban);color:#2a1b00;border-color:var(--ban)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}.scr{overflow-x:auto}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}.bar .btn{flex:1;padding:10px 6px;white-space:nowrap;font-size:15px}

const TIMES=[[8,"8:00 AM"],[10,"10:00 AM"],[13,"1:00 PM"],[16,"4:00 PM"],[17,"5:00 PM"]];let calCur=new Date();calCur.setDate(1);let selDate="",selTime="";const isoD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");function calState(d){const t=new Date();t.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);if(x<t)return "off";return ((d.getDate()*31+(d.getMonth()+1)*17+d.getFullYear())%11===0)?"low":"open"}function renderTimes(){const t=T[L],box=$("timeSlots");box.innerHTML="";if(!selDate){$("calPick").textContent="";return}let list=TIMES.slice();if(calState(new Date(selDate+"T12:00:00"))==="low")list=list.slice(-2);if(selDate===isoD(new Date())){const h=new Date().getHours();list=list.filter(x=>x[0]>h)}$("calPick").textContent=list.length?t.pickTime:t.noTimes;list.forEach(x=>{const b=document.createElement("button");b.type="button";b.className="tpill"+(selTime===x[1]?" sel":"");b.textContent=x[1];b.onclick=()=>{selTime=x[1];renderTimes()};box.append(b)})}function renderCal(){const y=calCur.getFullYear(),m=calCur.getMonth(),now=new Date();$("calTitle").textContent=calCur.toLocaleDateString(L==="es"?"es":"en",{month:"long",year:"numeric"});$("calPrev").disabled=(y===now.getFullYear()&&m===now.getMonth());const mx=new Date(now.getFullYear(),now.getMonth()+6,1);$("calNext").disabled=(y===mx.getFullYear()&&m===mx.getMonth());const grid=$("calGrid");grid.innerHTML="";const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++){const s=document.createElement("span");s.className="calblank";grid.append(s)}for(let d=1;d<=days;d++){const dt=new Date(y,m,d),st=calState(dt),b=document.createElement("button");b.type="button";b.textContent=d;b.className="calday "+st+(selDate===isoD(dt)?" sel":"");b.disabled=st==="off";b.setAttribute("aria-label",isoD(dt));b.onclick=()=>{selDate=isoD(dt);selTime="";$("ar").value=selDate;renderCal()};grid.append(b)}renderTimes()}$("calPrev").onclick=()=>{calCur=new Date(calCur.getFullYear(),calCur.getMonth()-1,1);renderCal()};$("calNext").onclick=()=>{calCur=new Date(calCur.getFullYear(),calCur.getMonth()+1,1);renderCal()};
document.querySelectorAll(".mos img").forEach(i=>i.onclick=()=>{$("lb").firstElementChild.src=i.src;$("lb").style.display="flex"});$("lb").onclick=()=>$("lb").style.display="none";

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function boot(){try{const u=await claude.use("user");db=await claude.use("db");if(db&&u&&await u.canEdit()){$("admin").classList.remove("hide");
db.collection("bookings").orderBy("at","desc").limit(50).onSnapshot(s=>{$("empty").textContent=s.docs.length?"":T[L].none;
$("rows").innerHTML=s.docs.map(d=>{const r=d.data();return `<tr><td>${new Date(r.at).toLocaleDateString()}</td><td>${esc(r.name)}<br>${esc(r.contact)}</td><td>${esc(lines(r)).replace(/\n/g,"<br>")}</td><td><button style="min-height:36px;padding:6px 10px" data-id="${d.id}" data-d="${r.done?1:0}">${r.done?"✓":T[L].done}</button></td></tr>`}).join("");
$("rows").querySelectorAll("button").forEach(b=>b.onclick=()=>db.doc("bookings/"+b.dataset.id).update({done:b.dataset.d!=="1"}).catch(()=>{}))},()=>{})}}catch(e){}}
const V=i=>$(i).value.trim(),lab=c=>T[L][c]||c||"-";let two=false;
function setTwo(v){two=v;$("dv2").classList.toggle("hide",!v);$("add2").classList.toggle("hide",v)}
$("add2").onclick=()=>setTwo(true);$("rm2").onclick=()=>setTwo(false);
[1,2].forEach(n=>{$("ce"+n).onchange=e=>$("co"+n).classList.toggle("hide",e.target.value!=="cOth");$("cs"+n).onchange=e=>$("cw"+n).classList.toggle("hide",e.target.value!=="yes")});
$("shl").onclick=()=>$("shl").select();
$("shb").onclick=async()=>{try{if(navigator.share){await navigator.share({title:"Banana Nut Burgers",url:SHARE});return}}catch(e){if(e&&e.name==="AbortError")return}
try{await navigator.clipboard.writeText(SHARE);$("shb").textContent=T[L].copied}catch(e){$("shl").select()}};
function diver(n){const o={cert:$("ce"+n).value,certOther:V("co"+n),logged:V("lg"+n),last:$("ld"+n).value,fun:$("fn"+n).value,course:$("cs"+n).value,courses:V("ct"+n)};if(n===2)o.name=V("dn2");return o}
function lines(r){const t=T[L],l=lab;const a=[`${r.service}`,`${r.name} · ${r.contact}${r.email?" · "+r.email:""}`,`${t.guests}: ${r.guests} · ${t.dateTime}: ${r.date||r.arrival||"-"}${r.time?" "+r.time:""}`];
(r.divers||[]).forEach((d,i)=>a.push(`${d.name||t["diver"+(i+1)]}: ${l(d.cert)}${d.certOther?" ("+d.certOther+")":""} · ${t.logged}: ${d.logged||"-"} · ${t.last}: ${d.last||"-"} · ${l(d.fun)} · ${t.course} ${l(d.course)}${d.courses?" ("+d.courses+")":""}`));
if(r.cruise)a.push(`${t.cruiseH} ${t.cFun} ${l(r.cruise.fun)}; ${t.cSnorkel} ${l(r.cruise.snorkel)}; ${t.cTry} ${l(r.cruise.tryScuba)}`);
if(r.note)a.push(r.note);return a.join("\n")}
$("send").onclick=async()=>{const t=T[L],n=(V("n")+" "+V("ln")).trim(),c=V("c"),em=V("em"),cp=$("cb").checked;
const ds=sel<4?[diver(1)].concat(two?[diver(2)]:[]):[];
if(!V("n")||!V("ln")||!c){$("st").textContent=t.need;return}
if(ds.some(d=>!d.cert)){$("st").textContent=t.needCert;return}
if(!selDate||!selTime){$("st").textContent=t.needDate;$("cal").scrollIntoView({behavior:"smooth",block:"center"});return}
if(cp&&!/.+@.+\..+/.test(em)){$("st").textContent=t.needMail;return}
const cr=[V("cr1"),V("cr2"),V("cr3")];
const r={name:n,firstName:V("n"),lastName:V("ln"),contact:c,email:em,guests:+$("g").value||1,arrival:$("ar").value,departure:"",date:selDate,time:selTime,service:t.svc[sel][1],divers:ds,note:V("m").slice(0,500),hp:V("hp"),at:Date.now(),done:false};
if(cr.some(x=>x))r.cruise={fun:cr[0],snorkel:cr[1],tryScuba:cr[2]};
const txt=lines(r);let ok=false;try{if(db){await db.collection("bookings").add(r);ok=true}}catch(e){}
if(!ok&&ENDPOINT){try{const x=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(r)});ok=x.ok}catch(e){}}
let h=ok?`<p class="ok">${t.sent}</p>`:`<p>${t.waOnly}</p>`;
h+=`<p><a class="btn wa" style="width:100%" target="_blank" rel="noopener" href="https://wa.me/${PH}?text=${encodeURIComponent(txt)}">${ok?t.sendWA:t.sendWA2}</a></p>`;
if(cp)h+=`<p><a class="btn ghostb" id="ml" style="width:100%" target="_blank" rel="noopener" href="mailto:${encodeURIComponent(em).replace(/%40/g,"@")}?subject=${encodeURIComponent("Banana Nut Burgers · "+r.service)}&body=${encodeURIComponent(txt)}">${t.openMail}</a></p>`;
try{localStorage.setItem("bnb_reg_prefill",JSON.stringify({activity:["Scuba","Dives & courses","Island tours","Snorkel","Beach & bar","Hike & explore"][sel],plannedDate:typeof selDate!=="undefined"?selDate:"",participants:+$("g").value||1,firstName:V("n"),lastName:V("ln"),phone:c,email:em}))}catch(e){}
h+=`<p><a class="btn ban" style="width:100%" href="register.html">${t.regContinue}</a></p>`;
$("st").innerHTML=h;if(cp){try{$("ml").click()}catch(e){}}};
render();if(window.claude)boot();if(location.hash==="#book")setTimeout(()=>$("book").scrollIntoView(),50);
</script></body></html>
