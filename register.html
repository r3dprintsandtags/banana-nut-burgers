<html lang="en">

<meta charset="utf-8">

<title>Digital Dive Check-In · Banana Nut Burgers Dive Shop</title>
<meta name="description" content="Complete your Banana Nut Burgers dive registration before arrival: guided check-in, forms, electronic signature, and confirmation.">
<style>
:root{--bg:#fff8e6;--card:#fff;--ink:#0a2533;--navy:#06161f;--mut:#5a6e78;--pri:#0a86b0;--teal:#0e7a6d;--ban:#ffc928;--line:#eadfc2;--ok:#17a35c;--red:#d64545}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06161f;--card:#0d2634;--ink:#eef8fc;--mut:#9bb6c2;--pri:#42c8f2;--line:#1b3a4a}}
:root[data-theme="dark"]{--bg:#06161f;--card:#0d2634;--ink:#eef8fc;--mut:#9bb6c2;--pri:#42c8f2;--line:#1b3a4a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:40px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0;max-width:760px;margin:0 auto}
.top button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;min-height:40px;padding:8px 14px;font-weight:700;cursor:pointer}
.brand{display:flex;gap:10px;align-items:center}.brand b{font-size:15px;letter-spacing:.5px}
h1{font-size:28px;margin:14px 0 4px}h2{font-size:20px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}
label{display:block;font-weight:600;margin-top:14px;font-size:15px}
input,select,textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:48px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.row{grid-template-columns:1fr}}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;background:var(--pri);color:#fff;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)}
.ban{background:var(--ban);color:#0a2533}
.hide{display:none}.mut{color:var(--mut);font-size:14px}.err{color:var(--red);font-weight:600;font-size:14px;min-height:20px}.okmsg{color:var(--ok);font-weight:600;font-size:14px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:14px}
.chk input{width:22px;min-height:22px;height:22px;flex:none;margin-top:2px}
.decl{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);margin-top:10px}
.steps{display:flex;gap:6px;margin:16px 0 4px}.steps span{flex:1;height:8px;border-radius:99px;background:var(--line)}.steps span.on{background:var(--pri)}
.track{list-style:none;margin:10px 0;padding:0}.track li{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-top:6px;background:var(--card);font-size:15px}
.track .st{margin-left:auto;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.st.done{color:var(--ok)}.st.todo{color:var(--red)}.st.wait{color:var(--mut)}
canvas.sigpad{width:100%;height:180px;border:1.5px dashed var(--pri);border-radius:12px;background:#fff;touch-action:none}
.ref{font-size:26px;font-weight:800;letter-spacing:1px;color:var(--pri)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;font-size:15px}.kv b{color:var(--mut);font-weight:600}
.doc{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);font-size:14px;white-space:pre-wrap;max-height:300px;overflow:auto}
.formitem{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:var(--bg)}
.pill{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--ban);color:#0a2533}
.pill.opt{background:var(--line);color:var(--ink)}
</style>
</head>
<body>
<div class="top">
  <div class="brand">
    <svg viewBox="0 0 120 120" width="40" height="40" role="img" aria-label="Banana Nut Burgers logo"><circle cx="60" cy="60" r="58" fill="#0a86b0" stroke="#ffc928" stroke-width="4"/><path d="M22 56a38 30 0 0 1 76 0z" fill="#d98b3a"/><rect x="22" y="58" width="76" height="10" rx="5" fill="#7ac74f"/><path d="M22 74a38 18 0 0 0 76 0z" fill="#d98b3a"/></svg>
    <b>BANANA NUT BURGER<br>DIVE SHOP</b>
  </div>
  <button id="langBtn" type="button">ES</button>
</div>
<div class="wrap">
  <h1>🤿 <span data-i="h1"></span></h1>
  <p class="mut" data-i="sub"></p>
  <div class="steps" id="steps"><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <p class="mut" id="stepLabel"></p>
  <ul class="track" id="tracker"></ul>

  <!-- 0 landing -->
  <section class="card" data-step="0">
    <h2 data-i="aH"></h2>
    <p data-i="aP1"></p><p data-i="aP2"></p>
    <div id="requirements"><b data-i="reqH"></b><p class="mut" data-i="reqP"></p></div>
    <p class="mut"><span data-i="priv"></span></p>
    <p class="mut"><span data-i="help"></span> <a href="https://wa.me/50498763374" target="_blank" rel="noopener">WhatsApp +504 9876-3374</a> · <a href="mailto:banananutburgers@gmail.com">banananutburgers@gmail.com</a></p>
    <p><button type="button" id="startBtn" class="ban" style="width:100%;font-size:18px" data-i="start"></button></p>
    <p><button type="button" class="ghost" id="resumeOpen" data-i="resumeOpen"></button>
       <button type="button" class="ghost" id="corrBtn" data-i="corrOpen"></button></p>
    <div id="resumePanel" class="hide">
      <label for="rRef" data-i="corrRef"></label><input id="rRef" placeholder="BNB-2026-XXXXXX">
      <label for="rTok" data-i="resumeCode"></label><input id="rTok" autocomplete="off">
      <p class="err" id="resumeErr" aria-live="polite"></p>
      <p><button type="button" id="resumeBtn" data-i="resumeBtn"></button></p>
      <p class="mut" data-i="resumeNote"></p>
    </div>
  </section>

  <!-- 1 trip & activity -->
  <section class="card hide" data-step="1">
    <h2 data-i="tH"></h2>
    <label for="act" data-i="activity"></label><select id="act"><option value="" id="actPh"></option></select>
    <div class="row">
      <div><label for="pdate" data-i="pdate"></label><input id="pdate" type="date"></div>
      <div><label for="parts" data-i="parts"></label><input id="parts" type="number" min="1" max="20" value="1" inputmode="numeric"></div>
    </div>
    <label for="bref" data-i="bref"></label><input id="bref" autocomplete="off">
    <p class="err" id="err1" aria-live="polite"></p>
    <p><button type="button" class="ghost nav" data-to="0" data-i="back"></button> <button type="button" class="toNext" data-from="1" data-i="next"></button></p>
  </section>

  <!-- 2 diver info -->
  <section class="card hide" data-step="2">
    <h2 data-i="bH"></h2>
    <div class="row">
      <div><label for="fn" data-i="first"></label><input id="fn" autocomplete="given-name"></div>
      <div><label for="ln" data-i="last"></label><input id="ln" autocomplete="family-name"></div>
    </div>
    <label for="pn" data-i="pref"></label><input id="pn" autocomplete="nickname">
    <div class="row">
      <div><label for="ph" data-i="phone"></label><input id="ph" type="tel" autocomplete="tel" inputmode="tel"></div>
      <div><label for="em" data-i="email"></label><input id="em" type="email" autocomplete="email"></div>
    </div>
    <label for="plang" data-i="plang"></label><select id="plang"><option value="en">English</option><option value="es">Español</option></select>
    <div class="row">
      <div><label for="cert" data-i="cert"></label><select id="cert">
        <option value="" data-i="sel"></option><option value="None">None</option><option value="Open Water">Open Water</option>
        <option value="Advanced Open Water">Advanced Open Water</option><option value="Rescue">Rescue</option><option value="Other">Other</option></select></div>
      <div><label for="logged" data-i="logged"></label><input id="logged" type="number" min="0" inputmode="numeric"></div>
    </div>
    <div class="row">
      <div><label for="lastdive" data-i="lastdive"></label><input id="lastdive" type="date"></div>
      <div><label for="en" data-i="emgName"></label><input id="en" autocomplete="off"></div>
    </div>
    <div class="row">
      <div><label for="erel" data-i="emgRel"></label><input id="erel" autocomplete="off"></div>
      <div><label for="ep" data-i="emgPhone"></label><input id="ep" type="tel" inputmode="tel"></div>
    </div>
    <label for="notes" data-i="notes"></label><textarea id="notes" rows="2"></textarea>
    <p class="okmsg" id="draftMsg"></p>
    <p class="err" id="err2" aria-live="polite"></p>
    <p><button type="button" class="ghost nav" data-to="1" data-i="back"></button> <button type="button" id="saveNext2" data-i="saveNext"></button></p>
  </section>

  <!-- 3 required forms -->
  <section class="card hide" data-step="3">
    <h2 data-i="fH2"></h2>
    <p class="mut" data-i="fSub"></p>
    <div id="formList"></div>
    <p><button type="button" class="ghost nav" data-to="2" data-i="back"></button> <button type="button" class="toNext" data-from="3" data-i="next"></button></p>
  </section>

  <!-- 4 waivers & signature -->
  <section class="card hide" data-step="4">
    <h2 data-i="dH"></h2>
    <p class="mut" data-i="dSub"></p>
    <div class="doc" id="docPreview"></div>
    <div class="decl"><b id="declTitle"></b><p id="declText"></p>
      <label class="chk"><input type="checkbox" id="cbDecl"><span id="declCheck"></span></label></div>
    <div class="decl"><p id="privText"></p>
      <label class="chk"><input type="checkbox" id="cbPriv"><span data-i="privCheck"></span></label></div>
    <div class="decl"><p id="mktText"></p>
      <label class="chk"><input type="checkbox" id="cbMkt"><span data-i="mktCheck"></span></label></div>
    <label for="signer" data-i="signer"></label><input id="signer" autocomplete="name">
    <label data-i="draw"></label>
    <canvas class="sigpad" id="pad" width="640" height="180"></canvas>
    <p><button type="button" class="ghost" id="clearPad" data-i="clear"></button></p>
    <p class="err" id="err4" aria-live="polite"></p>
    <p><button type="button" class="ghost nav" data-to="3" data-i="back"></button> <button type="button" id="toSafety" data-i="next"></button></p>
  </section>

  <!-- 5 safety & medical -->
  <section class="card hide" data-step="5">
    <h2 data-i="sH"></h2>
    <div class="decl"><b data-i="sPend"></b><p data-i="sP"></p></div>
    <p><button type="button" class="ghost nav" data-to="4" data-i="back"></button> <button type="button" class="toNext" data-from="5" data-i="next"></button></p>
  </section>

  <!-- 6 review & submit -->
  <section class="card hide" data-step="6">
    <h2 data-i="eH"></h2>
    <div class="kv" id="review"></div>
    <p class="err" id="err6" aria-live="polite"></p>
    <p><button type="button" class="ghost nav" data-to="2" data-i="edit"></button></p>
    <p><button type="button" id="submitBtn" class="ban" style="width:100%" data-i="submit"></button></p>
  </section>

  <!-- 7 confirmation -->
  <section class="card hide" data-step="7">
    <h2>✅ <span data-i="doneH"></span></h2>
    <p><span class="pill" data-i="statusAwait"></span></p>
    <p data-i="fRef"></p><p class="ref" id="confRef"></p>
    <p class="mut" id="confWhen"></p>
    <div id="confList"></div>
    <p data-i="fNext"></p>
    <p><a class="btn" href="./" data-i="fBack"></a></p>
  </section>

  <!-- correction request -->
  <section class="card hide" id="corrCard">
    <h2 data-i="corrH"></h2>
    <p class="mut" data-i="corrSub"></p>
    <label for="cRef" data-i="corrRef"></label><input id="cRef" placeholder="BNB-2026-XXXXXX">
    <label for="cPhone" data-i="phone"></label><input id="cPhone" type="tel" inputmode="tel">
    <label for="cName" data-i="fullName"></label><input id="cName">
    <label for="cMsg" data-i="corrMsg"></label><textarea id="cMsg" rows="3"></textarea>
    <p class="err" id="corrErr" aria-live="polite"></p>
    <p><button type="button" id="corrSend" data-i="corrSend"></button></p>
  </section>
  <input id="hp" class="hide" tabindex="-1" autocomplete="off" aria-hidden="true">
</div>

function fill(d){
  const map = { act:"activity", pdate:"plannedDate", parts:"participants", bref:"bookingRef", fn:"firstName", ln:"lastName", pn:"preferredName", ph:"phone", em:"email", plang:"preferredLanguage", cert:"cert", logged:"loggedDives", lastdive:"lastDive", en:"emergencyName", erel:"emergencyRelationship", ep:"emergencyPhone", notes:"notes" };
  Object.entries(map).forEach(([id, k]) => { if (d[k] !== undefined && d[k] !== "") $(id).value = d[k]; });
}
function state(){
  const d = collect();
  const formsDone = $("cbDecl").checked && $("cbPriv").checked && signed && !!V("signer");
  return {
    activity: !!d.activity, diver: !!(d.firstName && d.lastName && d.phone.replace(/\D/g,"").length >= 8),
    forms: formsDone, waivers: formsDone, safety: false, review: !!submittedRef
  };
}
function tracker(){
  const t = T[L], s = state();
  const item = (label, val, pend) => `<li><span>${label}</span><span class="st ${pend ? "wait" : val ? "done" : (step > 0 ? "todo" : "wait")}">${pend ? t.stPend : val ? t.stDone : (step > 0 ? t.stTodo : t.stWait)}</span></li>`;
  $("tracker").innerHTML = item(t.trActivity, s.activity) + item(t.trDiver, s.diver) + item(t.trForms, s.forms)
    + item(t.trWaivers, s.waivers) + item(t.trSafety, false, true) + item(t.trReview, s.review);
  $("stepLabel").textContent = step >= 1 && step <= 6 ? `${t.stepOf} ${step} ${t.of} 6` : "";
}
function applyLang(){
  const t = T[L], d = DECL[L];
  document.documentElement.lang = L;
  document.querySelectorAll("[data-i]").forEach(e => { if (t[e.dataset.i]) e.textContent = t[e.dataset.i]; });
  $("langBtn").textContent = L === "en" ? "ES" : "EN";
  $("declTitle").textContent = d.title; $("declText").textContent = d.text; $("declCheck").textContent = d.check;
  $("privText").textContent = d.priv; $("mktText").textContent = d.mkt;
  $("actPh").textContent = t.sel;
  if ($("act").options.length <= 1) ACTS.forEach(a => { const o = document.createElement("option"); o.textContent = a; $("act").append(o); });
  $("pdate").min = new Date().toISOString().slice(0, 10);
  renderForms(); buildDoc(); tracker();
}
$("langBtn").onclick = () => { L = L === "en" ? "es" : "en"; applyLang(); };

function go(n){
  step = n;
  document.querySelectorAll("[data-step]").forEach(s => s.classList.toggle("hide", Number(s.dataset.step) !== n));
  document.querySelectorAll("#steps span").forEach((s, i) => s.classList.toggle("on", i < Math.min(Math.max(n - 1, 0), 5)));
  window.scrollTo({ top: 0, behavior: "smooth" });
  if (n === 3) loadForms();
  if (n === 4) { buildDoc(); sizePad(); }
  if (n === 6) buildReview();
  tracker();
}
document.querySelectorAll(".nav").forEach(b => b.onclick = () => go(Number(b.dataset.to)));
$("startBtn").onclick = () => go(1);
$("corrBtn").onclick = () => { $("corrCard").classList.toggle("hide"); $("corrCard").scrollIntoView({ behavior: "smooth" }); };
$("resumeOpen").onclick = () => { $("resumePanel").classList.toggle("hide"); if (draft.ref) $("rRef").value = draft.ref; if (draft.token) $("rTok").value = draft.token; };

document.querySelectorAll(".toNext").forEach(b => b.onclick = async () => {
  const from = Number(b.dataset.from);
  if (from === 1 && !V("act")) { $("err1").textContent = T[L].needAct; return; }
  $("err1").textContent = "";
  await saveDraft();
  go(from + 1);
});
$("saveNext2").onclick = async () => {
  const d = collect();
  if (!d.firstName || !d.lastName || d.phone.replace(/\D/g,"").length < 8) { $("err2").textContent = T[L].needName; return; }
  $("err2").textContent = "";
  await saveDraft(true);
  go(3);
};

async function saveDraft(show){
  const d = collect();
  if (!d.firstName || !d.lastName || d.phone.replace(/\D/g,"").length < 8) return;
  try {
    const body = draft.ref && draft.token ? { ref: draft.ref, token: draft.token, data: d } : { data: d };
    const r = await fetch("/api/register/draft", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const out = await r.json().catch(() => ({}));
    if (r.ok && out.ref) {
      draft.ref = out.ref; if (out.token) draft.token = out.token; saveLocal();
      if (show) $("draftMsg").textContent = `${T[L].saved}: ${out.ref} · ${T[L].resumeCode.replace(" *","")}: ${draft.token}`;
    }
  } catch(e) { /* offline: data stays on this device and in the form */ }
}

$("resumeBtn").onclick = async () => {
  const ref = V("rRef").toUpperCase(), token = V("rTok");
  try {
    const r = await fetch(`/api/register/draft?ref=${encodeURIComponent(ref)}&token=${encodeURIComponent(token)}`);
    const out = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error("bad");
    draft.ref = out.ref; draft.token = token; saveLocal();
    fill(out.data || {});
    if (out.data?.preferredLanguage) { L = out.data.preferredLanguage === "es" ? "es" : "en"; applyLang(); }
    go(1);
  } catch(e) { $("resumeErr").textContent = T[L].resumeBad; }
};

async function loadForms(){
  try {
    const r = await fetch("/api/forms?activity=" + encodeURIComponent(V("act")));
    const out = await r.json().catch(() => ({}));
    forms = out.forms && out.forms.length ? out.forms : [{ name_en:"Customer Registration", name_es:"Registro de clientes", desc_en:"Your contact and diver information, accuracy declaration, and electronic signature.", desc_es:"Tu información de contacto y de buzo, declaración de exactitud y firma electrónica.", required:1, version:"registration-v1" }];
  } catch(e) { forms = [{ name_en:"Customer Registration", name_es:"Registro de clientes", desc_en:"", desc_es:"", required:1, version:"registration-v1" }]; }
  renderForms();
}
function renderForms(){
  const t = T[L], s = state();
  if (!$("formList")) return;
  $("formList").innerHTML = forms.map(f => `<div class="formitem">
    <b>${esc(L === "es" ? (f.name_es || f.name_en) : f.name_en)}</b> <span class="pill ${f.required ? "" : "opt"}">${f.required ? t.req : t.opt}</span>
    <span class="pill opt">${t.ver}: ${esc(f.version)}</span>
    <span class="st ${s.forms ? "done" : "todo"}" style="float:right">${s.forms ? t.stDone : t.stTodo}</span>
    <p class="mut" style="margin:6px 0 0">${esc(L === "es" ? (f.desc_es || f.desc_en || "") : (f.desc_en || ""))}</p></div>`).join("");
}

function buildDoc(){
  const d = collect(), dec = DECL[L];
  $("docPreview").textContent =
`BANANA NUT BURGERS DIVE SHOP — CUSTOMER REGISTRATION (registration-v1)
${d.activity || "-"} · ${d.plannedDate || "-"} · ${d.participants || 1}

${d.firstName} ${d.lastName}${d.preferredName ? " (" + d.preferredName + ")" : ""}
Phone: ${d.phone}  Email: ${d.email || "-"}
Certification: ${d.cert || "-"}  Logged dives: ${d.loggedDives || "-"}  Last dive: ${d.lastDive || "-"}
Emergency: ${d.emergencyName || "-"}${d.emergencyRelationship ? " (" + d.emergencyRelationship + ")" : ""} ${d.emergencyPhone || ""}

${dec.title.toUpperCase()}
${dec.text}

Privacy: ${$("cbPriv").checked ? "acknowledged" : "—"} · Marketing: ${$("cbMkt").checked ? "agreed" : "not granted"}`;
}
function buildReview(){
  const d = collect(), t = T[L];
  const rows = [[t.activity, d.activity],[t.pdate, d.plannedDate],[t.first + " / " + t.last, (d.firstName + " " + d.lastName).trim()],[t.phone, d.phone],[t.email, d.email],[t.cert, d.cert],[t.emgName, d.emergencyName]];
  $("review").innerHTML = rows.filter(r => r[1]).map(r => `<b>${esc(r[0])}</b><span>${esc(r[1])}</span>`).join("");
  tracker();
}

// signature pad
const pad = $("pad"), ctx = pad.getContext("2d"); let drawing = false;
function sizePad(){
  const r = pad.getBoundingClientRect(), img = signed ? pad.toDataURL() : null;
  pad.width = Math.round(r.width * 2); pad.height = 360;
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, pad.width, pad.height);
  ctx.strokeStyle = "#0a2533"; ctx.lineWidth = 4; ctx.lineCap = "round";
  if (img) { const i = new Image(); i.onload = () => ctx.drawImage(i, 0, 0, pad.width, pad.height); i.src = img; }
}
function pos(e){ const r = pad.getBoundingClientRect(); return { x: (e.clientX - r.left) * pad.width / r.width, y: (e.clientY - r.top) * pad.height / r.height }; }
pad.addEventListener("pointerdown", e => { drawing = true; signed = true; pad.setPointerCapture(e.pointerId); const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); tracker(); });
pad.addEventListener("pointermove", e => { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
pad.addEventListener("pointerup", () => { drawing = false; tracker(); });
$("clearPad").onclick = () => { signed = false; ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, pad.width, pad.height); tracker(); };
["cbDecl","cbPriv","cbMkt"].forEach(id => $(id).addEventListener("change", () => { buildDoc(); tracker(); }));
$("signer").addEventListener("input", tracker);

$("toSafety").onclick = () => {
  if (!$("cbDecl").checked || !$("cbPriv").checked || !V("signer") || !signed) { $("err4").textContent = T[L].needDecl; return; }
  $("err4").textContent = ""; saveDraft(); go(5);
};

$("submitBtn").onclick = async () => {
  const t = T[L], d = collect(), missing = [];
  if (!d.activity) missing.push(t.activity);
  if (!d.firstName || !d.lastName) missing.push(t.first);
  if (!$("cbDecl").checked || !signed) missing.push(t.trWaivers);
  if (missing.length) { $("err6").textContent = t.missing + missing.join(", "); return; }
  $("submitBtn").disabled = true; $("submitBtn").textContent = t.sending;
  try {
    const r = await fetch("/api/register", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
      ...d, accuracyDeclaration: $("cbDecl").checked, privacyAck: $("cbPriv").checked, marketingConsent: $("cbMkt").checked,
      signerName: V("signer"), signatureDataUrl: pad.toDataURL("image/png"), hp: V("hp"),
      idempotencyKey: draft.idempotencyKey, draftRef: draft.ref || "", draftToken: draft.token || ""
    })});
    const out = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(out.error || "failed");
    submittedRef = out.ref;
    $("confRef").textContent = out.ref;
    $("confWhen").textContent = new Date(out.submittedAt).toLocaleString(L === "es" ? "es" : "en");
    const s = state();
    $("confList").innerHTML = `<ul class="track">${[["trActivity",s.activity],["trDiver",s.diver],["trForms",true],["trWaivers",true]].map(([k,v]) => `<li><span>${t[k]}</span><span class="st done">${t.stDone}</span></li>`).join("")}<li><span>${t.trSafety}</span><span class="st wait">${t.stPend}</span></li><li><span>${t.trReview}</span><span class="st wait">${t.statusAwait}</span></li></ul>`;
    $("cRef").value = out.ref;
    draft = { idempotencyKey: draft.idempotencyKey }; saveLocal(); // draft consumed; keep key so a retry returns the same ref
    go(7);
  } catch(e) {
    await saveDraft();
    $("err6").textContent = e.message && e.message !== "failed" ? e.message : t.failed;
    $("submitBtn").disabled = false; $("submitBtn").textContent = t.submit;
  }
};

$("corrSend").onclick = async () => {
  const body = { ref: V("cRef"), phone: V("cPhone"), name: V("cName"), message: V("cMsg"), hp: V("hp") };
  if (!body.ref || !body.phone || !body.message) { $("corrErr").textContent = T[L].needName; return; }
  await fetch("/api/corrections", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).catch(() => {});
  $("corrErr").textContent = ""; $("corrSend").textContent = "✓ " + T[L].corrOk;
  $("cMsg").value = "";
};

applyLang();
if (draft.ref) { /* same-device resume is one tap away */ $("resumeOpen").textContent += ""; }
if (location.hash === "#resume") $("resumeOpen").click();
if (location.hash === "#requirements") setTimeout(() => $("requirements").scrollIntoView({ behavior: "smooth" }), 300);
go(0);
</script>
</body>
</html>
