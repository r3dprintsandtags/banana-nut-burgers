<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Dive Check-In · Banana Nut Burgers Dive Shop</title>
<meta name="description" content="Complete your Banana Nut Burgers dive registration before arrival: guided check-in, forms, electronic signature, and confirmation.">
<style>
:root{--bg:#fff8e6;--card:#fff;--ink:#0a2533;--navy:#06161f;--mut:#5a6e78;--pri:#0a86b0;--teal:#0e7a6d;--ban:#ffc928;--line:#eadfc2;--ok:#17a35c;--red:#d64545}
*{box-sizing:border-box}html{overflow-y:scroll;-webkit-overflow-scrolling:touch}body{margin:0;background:#06161f url(img/reef-swim.jpg) center/cover fixed no-repeat;color:#0a2533;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:40px;overflow-x:hidden;min-height:100%}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(6,22,31,.5) 0%,rgba(6,22,31,.72) 40%,rgba(6,22,31,.9) 100%)}
.wrap,.top{position:relative;z-index:1}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0;max-width:760px;margin:0 auto}
.top button{background:rgba(255,255,255,.88);backdrop-filter:blur(10px);color:var(--ink);border:1px solid rgba(255,255,255,.4);border-radius:99px;min-height:40px;padding:8px 14px;font-weight:700;cursor:pointer}
.brand{display:flex;gap:10px;align-items:center;color:#f5fbff;text-shadow:0 2px 10px rgba(0,0,0,.45)}.brand b{font-size:15px;letter-spacing:.5px}
h1{font-size:28px;margin:14px 0 4px;color:#f5fbff;text-shadow:0 2px 14px rgba(0,0,0,.5)}h2{font-size:20px;margin:0 0 8px}
.wrap > .mut,.wrap > #stepLabel{color:#d7eef8!important;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.card{background:#fff!important;color:#0a2533!important;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.55);border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 16px 48px rgba(0,0,0,.22)}
.card h2,.card h3,.card label,.card .chk,.card .ghost{color:#0a2533!important}
.card .ghost{border-color:#c5b89a;background:#f7fafc;color:#075a78!important}
.card .mut,.card .note{color:#5a6e78!important}
.cal{background:#fff!important;color:#0a2533!important}
.calnav,.tpill{background:#fff!important;color:#0a2533!important;border:1.5px solid #0a2533!important}
.tpill.sel,.tpill[aria-pressed="true"]{background:#2563eb!important;color:#fff!important;border-color:#1d4ed8!important}
.calhead b,.callegend,#calPick{color:#0a2533!important}
#calPick.picked{color:#075a78!important;font-weight:700}
.track li{background:#fff!important;color:#0a2533!important;backdrop-filter:blur(10px)}
.decl,.doc,.formitem,.yesno label{background:#f7fafc!important;color:#0a2533!important;border-color:#c5b89a}
.steps span{background:rgba(255,255,255,.35)}.steps span.on{background:var(--pri)}
label{display:block;font-weight:600;margin-top:14px;font-size:15px}
input,select,textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid #c5b89a;background:#fff!important;color:#0a2533!important;min-height:48px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.row{grid-template-columns:1fr}}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;background:var(--pri);color:#fff;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)}
.ban{background:var(--ban);color:#0a2533}
.hide{display:none}.mut{color:var(--mut);font-size:14px}.err{color:var(--red);font-weight:600;font-size:14px;min-height:20px}.okmsg{color:var(--ok);font-weight:600;font-size:14px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:14px}
.chk input{width:22px;min-height:22px;height:22px;flex:none;margin-top:2px}
.decl{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);margin-top:10px}
.steps{display:flex;gap:6px;margin:16px 0 4px}.steps span{flex:1;height:8px;border-radius:99px;background:var(--line)}.steps span.on{background:var(--pri)}
.track{list-style:none;margin:10px 0;padding:0}.track li{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-top:6px;background:var(--card);font-size:15px}
.track li.go{cursor:pointer}.track li.go:hover{border-color:var(--pri);background:#eef8fc}
.track .stepjump{width:100%;display:flex;gap:10px;align-items:center;background:#fff;color:#0a2533;border:0;padding:0;min-height:44px;font-weight:600;text-align:left}
.track li.locked .stepjump{background:#e7eef2;color:#0a2533}
.track .st{margin-left:auto;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.st.done{color:var(--ok)}.st.todo{color:var(--red)}.st.wait{color:var(--mut)}
.misslink{color:var(--pri);font-weight:700;text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;font:inherit}
canvas.sigpad{width:100%;height:180px;border:1.5px dashed var(--pri);border-radius:12px;background:#fff;touch-action:none}
.ref{font-size:26px;font-weight:800;letter-spacing:1px;color:var(--pri)}
.confIds{display:grid;gap:10px;margin:12px 0}.confIds .idbox{border:1px solid var(--line);border-radius:14px;padding:12px;background:#f7fafc;text-align:center}
.confIds .idlab{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}.confIds .idval{font-size:22px;font-weight:800;color:var(--pri);letter-spacing:1px;word-break:break-all}
.confQr{display:flex;flex-direction:column;align-items:center;gap:8px;margin:14px 0}.confQr img{width:180px;height:180px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.confActs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.confActs a,.confActs button{flex:1;min-width:140px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;font-size:15px}.kv b{color:var(--mut);font-weight:600}
.doc{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);font-size:14px;white-space:pre-wrap;max-height:300px;overflow:auto}
.formitem{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:var(--bg)}
.pill{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--ban);color:#0a2533}
.pill.opt{background:var(--line);color:var(--ink)}
.stepnav{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;align-items:center}
.stepnav .ban,.stepnav .toNext{flex:1;min-width:140px;background:var(--ban)!important;color:#0a2533!important}
.cal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:6px}.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.calhead b{font-size:18px;letter-spacing:2px;text-transform:uppercase}.calnav{width:44px;min-height:44px;padding:0;border-radius:10px;background:var(--card);color:var(--ink);border:1.5px solid var(--ink);font-size:22px;line-height:1}.calnav:disabled{opacity:.3;cursor:default}.caldow,.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.caldow span{text-align:center;font-size:11px;letter-spacing:1px;color:var(--mut);text-transform:uppercase;padding:4px 0}.calday{min-height:44px;padding:6px 0;border-radius:9px;font-weight:600;background:#cdeccd;color:#14532d;border:1px solid #9ed69e}.calday.low{background:#fdf0b8;color:#713f12;border-color:#ecd97a}.calday.off{background:#f6cfcf;color:#7f1d1d;border-color:#edaeae;opacity:.8;cursor:not-allowed}.calday.sel{background:#2563eb;color:#fff;border-color:#1d4ed8;box-shadow:0 2px 0 #1e3a8a}.calblank{min-height:44px}.callegend{font-size:13px;margin:10px 0 0}.times{display:flex;flex-wrap:wrap;gap:8px}.tpill{min-height:48px;padding:10px 18px;border-radius:99px;background:var(--card);color:var(--ink);border:1.5px solid var(--ink)}.tpill.sel{background:#2563eb;color:#fff;border-color:#1d4ed8}.tpill.off{opacity:.45;text-decoration:line-through}.yesno{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}.yesno label{margin-top:0;display:flex;gap:8px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;font-weight:600}.yesno input{width:20px;min-height:20px;height:20px;margin:0}
</style>
</head>
<body>
<div class="top">
  <div class="brand">
    <svg viewBox="0 0 120 120" width="40" height="40" role="img" aria-label="Banana Nut Burgers logo"><circle cx="60" cy="60" r="58" fill="#0a86b0" stroke="#ffc928" stroke-width="4"/><path d="M22 56a38 30 0 0 1 76 0z" fill="#d98b3a"/><rect x="22" y="58" width="76" height="10" rx="5" fill="#7ac74f"/><path d="M22 74a38 18 0 0 0 76 0z" fill="#d98b3a"/></svg>
    <b>BANANA NUT BURGER<br>DIVE SHOP</b>
  </div>
  <button id="langBtn" type="button">ES</button>
</div>
<div class="wrap">
  <h1>🤿 <span data-i="h1"></span></h1>
  <p class="mut" data-i="sub"></p>
  <p class="mut" id="stepLabel"></p>

  <!-- 0 landing -->
  <section class="card" data-step="0">
    <h2 data-i="aH"></h2>
    <p data-i="aP1"></p><p data-i="aP2"></p>
    <div id="requirements"><b data-i="reqH"></b><p class="mut" data-i="reqP"></p></div>
    <p class="mut"><span data-i="priv"></span></p>
    <p class="mut"><span data-i="help"></span> <a href="https://wa.me/50498763374">WhatsApp +504 9876-3374</a> · <a href="mailto:banananutburgers@gmail.com">banananutburgers@gmail.com</a></p>
    <p><button type="button" id="startBtn" class="ban" style="width:100%;font-size:18px" data-i="start"></button></p>
    <p><button type="button" class="ghost" id="resumeOpen" data-i="resumeOpen"></button>
       <button type="button" class="ghost" id="corrBtn" data-i="corrOpen"></button></p>
    <div id="resumePanel" class="hide">
      <label for="rRef" data-i="corrRef"></label><input id="rRef" placeholder="BNB-2026-XXXXXX">
      <label for="rTok" data-i="resumeCode"></label><input id="rTok" autocomplete="off">
      <p class="err" id="resumeErr" aria-live="polite"></p>
      <p><button type="button" id="resumeBtn" data-i="resumeBtn"></button></p>
      <p class="mut" data-i="resumeNote"></p>
    </div>
  </section>

  <!-- 1 trip & activity -->
  <section class="card hide" data-step="1">
    <h2 data-i="tH"></h2>
    <label for="act" data-i="activity"></label><select id="act"><option value="" id="actPh"></option></select>
    <label for="parts" data-i="parts"></label><input id="parts" type="number" min="1" max="20" value="1" inputmode="numeric">
    <label class="chk"><input type="checkbox" id="hasMinors"><span data-i="minorsLabel"></span></label>
    <div id="minorsBox" class="hide">
      <label for="minorCount" data-i="minorCount"></label><input id="minorCount" type="number" min="1" max="20" inputmode="numeric">
      <p class="mut" data-i="minorsLine"></p>
      <p class="mut" data-i="guardianLine"></p>
    </div>
    <label data-i="courseQ"></label>
    <div class="yesno">
      <label><input type="radio" name="course" id="courseYes" value="yes"><span data-i="yes"></span></label>
      <label><input type="radio" name="course" id="courseNo" value="no"><span data-i="no"></span></label>
    </div>
    <label data-i="pdate"></label>
    <div class="cal" id="cal">
      <div class="calhead">
        <button type="button" class="calnav" id="calPrev" aria-label="Previous month">‹</button>
        <b id="calTitle"></b>
        <button type="button" class="calnav" id="calNext" aria-label="Next month">›</button>
      </div>
      <div class="caldow"><span data-i="sun"></span><span data-i="mon"></span><span data-i="tue"></span><span data-i="wed"></span><span data-i="thu"></span><span data-i="fri"></span><span data-i="sat"></span></div>
      <div class="calgrid" id="calGrid"></div>
      <p class="callegend" data-i="calLegend"></p>
      <p class="mut" id="calPick"></p>
      <label data-i="availTimes"></label>
      <div class="times" id="timeSlots"></div>
    </div>
    <input type="hidden" id="pdate">
    <label for="bref" data-i="bref"></label><input id="bref" autocomplete="off">
    <p class="err" id="err1" aria-live="polite"></p>
    <p class="stepnav"><button type="button" class="ghost nav" data-to="0" data-i="back"></button> <button type="button" class="ban toNext" id="toStep2" data-from="1" data-i="next">Continue</button></p>
  </section>

  <!-- 2 diver info -->
  <section class="card hide" data-step="2">
    <h2 data-i="bH"></h2>
    <div class="row">
      <div><label for="fn" data-i="first"></label><input id="fn" autocomplete="given-name"></div>
      <div><label for="ln" data-i="last"></label><input id="ln" autocomplete="family-name"></div>
    </div>
    <label for="pn" data-i="pref"></label><input id="pn" autocomplete="nickname">
    <div class="row">
      <div><label for="ph" data-i="phone"></label><input id="ph" type="tel" autocomplete="tel" inputmode="tel"></div>
      <div><label for="em" data-i="email"></label><input id="em" type="email" autocomplete="email"></div>
    </div>
    <label for="plang" data-i="plang"></label><select id="plang"><option value="en">English</option><option value="es">Español</option></select>
    <label for="dob" data-i="dob"></label><input id="dob" type="date" autocomplete="bday" max="">
    <label for="addr" data-i="addr"></label><input id="addr" autocomplete="street-address">
    <div class="row">
      <div><label for="city" data-i="city"></label><input id="city" autocomplete="address-level2"></div>
      <div><label for="state" data-i="state"></label><input id="state" autocomplete="address-level1"></div>
    </div>
    <label for="zip" data-i="zip"></label><input id="zip" autocomplete="postal-code">
    <label data-i="ownGear"></label>
    <div class="yesno">
      <label><input type="radio" name="ownGear" id="gearYes" value="yes"><span data-i="yes"></span></label>
      <label><input type="radio" name="ownGear" id="gearNo" value="no"><span data-i="no"></span></label>
    </div>
    <div id="gearSizeWrap" class="hide">
      <label for="gearSize" data-i="gearSize"></label>
      <select id="gearSize">
        <option value="" data-i="sel"></option>
        <option value="XS">XS</option><option value="S">S</option><option value="M">M</option>
        <option value="L">L</option><option value="XL">XL</option><option value="XXL">XXL</option>
      </select>
      <label for="gearNote" data-i="gearNote"></label>
      <input id="gearNote" autocomplete="off" data-p="gearNotePh">
    </div>
    <div class="row">
      <div><label for="cert" data-i="cert"></label><select id="cert">
        <option value="" data-i="sel"></option><option value="None">None</option><option value="Open Water">Open Water</option>
        <option value="Advanced Open Water">Advanced Open Water</option><option value="Rescue">Rescue</option><option value="Other">Other</option></select></div>
      <div><label for="logged" data-i="logged"></label><input id="logged" type="number" min="0" inputmode="numeric"></div>
    </div>
    <div class="row">
      <div><label for="lastdive" data-i="lastdive"></label><input id="lastdive" type="date" max=""></div>
      <div><label for="en" data-i="emgName"></label><input id="en" autocomplete="off"></div>
    </div>
    <div class="row">
      <div><label for="erel" data-i="emgRel"></label><input id="erel" autocomplete="off"></div>
      <div><label for="ep" data-i="emgPhone"></label><input id="ep" type="tel" inputmode="tel"></div>
    </div>
    <label for="notes" data-i="notes"></label><textarea id="notes" rows="2"></textarea>
    <p class="okmsg" id="draftMsg"></p>
    <p class="err" id="err2" aria-live="polite"></p>
    <p><button type="button" class="ghost nav" data-to="1" data-i="back"></button> <button type="button" id="saveNext2" data-i="saveNext"></button></p>
  </section>

  <!-- 3 required forms (SSI packet) -->
  <section class="card hide" data-step="3">
    <h2 data-i="fH2"></h2>
    <p class="mut" data-i="fSub"></p>
    <div id="formList"></div>
    <div id="packetBox" class="hide" style="margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)">
      <p><b id="packetName"></b></p>
      <p class="mut" id="packetReg"></p>
      <p id="packetStatus" class="mut"></p>
      <div id="packetFrameWrap" class="hide"><iframe id="packetFrame" title="Registration forms" style="width:100%;min-height:78vh;border:0;border-radius:12px;background:#fff"></iframe></div>
      <p><button type="button" class="ghost" id="packetCheck" style="width:100%" data-i="packetCheck"></button></p>
      <p class="mut" data-i="packetHint"></p>
    </div>
    <p class="err" id="err3" aria-live="polite"></p>
    <p><button type="button" class="ghost nav" data-to="2" data-i="back"></button> <button type="button" id="toWaivers" data-i="next"></button></p>
  </section>

  <!-- 4 final shop signature (SSI packet already covered waivers/medical) -->
  <section class="card hide" data-step="4">
    <h2 data-i="dH"></h2>
    <p class="mut" data-i="dSub"></p>
    <div id="packetDoneBanner" class="decl hide">
      <b data-i="packetSignNote"></b>
      <p class="mut" data-i="packetSignSkip"></p>
    </div>
    <div class="doc" id="docPreview"></div>
    <div class="decl"><b id="declTitle"></b><p id="declText"></p>
      <label class="chk"><input type="checkbox" id="cbDecl"><span id="declCheck"></span></label></div>
    <div class="decl" id="privBlock"><p id="privText"></p>
      <label class="chk"><input type="checkbox" id="cbPriv"><span data-i="privCheck"></span></label></div>
    <div class="decl"><p id="mktText"></p>
      <label class="chk"><input type="checkbox" id="cbMkt"><span data-i="mktCheck"></span></label></div>
    <div id="signMedAcks" class="decl hide">
      <label class="chk"><input type="checkbox" id="cbPregnantSign"><span data-i="medPregnant"></span></label>
      <label class="chk"><input type="checkbox" id="cbMedTruthSign"><span data-i="medTruth"></span></label>
    </div>
    <div id="diverSets"></div>
    <label for="signer" data-i="signer"></label><input id="signer" autocomplete="name">
    <label data-i="draw"></label>
    <canvas class="sigpad" id="pad" width="640" height="180"></canvas>
    <p><button type="button" class="ghost" id="clearPad" data-i="clear"></button></p>
    <p class="err" id="err4" aria-live="polite"></p>
    <p><button type="button" class="ghost nav" data-to="3" data-i="back"></button> <button type="button" id="toSafety" data-i="next"></button></p>
  </section>

  <!-- 5 removed: SSI medical lives only in the packet (no duplicate shop questions) -->
  <section class="card hide" data-step="5">
    <h2 data-i="sH"></h2>
    <div class="decl">
      <b data-i="medPacketDone"></b>
      <p class="mut" data-i="medPacketSkip"></p>
      <p class="mut" id="medPacketFlag" style="display:none" data-i="medFlag"></p>
      <label class="chk"><input type="checkbox" id="cbPregnant" checked><span data-i="medPregnant"></span></label>
      <label class="chk"><input type="checkbox" id="cbMedTruth" checked><span data-i="medTruth"></span></label>
    </div>
    <p class="err" id="err5" aria-live="polite"></p>
    <p><button type="button" class="ghost nav" data-to="4" data-i="back"></button> <button type="button" id="toReview" data-i="next"></button></p>
  </section>

  <!-- 6 review & submit -->
  <section class="card hide" data-step="6">
    <h2 data-i="eH"></h2>
    <div class="kv" id="review"></div>
    <p class="err" id="err6" aria-live="polite"></p>
    <p class="mut" data-i="editHint"></p>
    <p><button type="button" id="submitBtn" class="ban" style="width:100%" data-i="submit"></button></p>
  </section>

  <!-- 7 confirmation -->
  <section class="card hide" data-step="7">
    <h2>✅ <span data-i="doneH"></span></h2>
    <p><span class="pill" data-i="statusAwait"></span></p>
    <p data-i="fRef"></p>
    <div class="confIds">
      <div class="idbox"><div class="idlab" data-i="confBooking"></div><div class="idval" id="confBooking">—</div></div>
      <div class="idbox"><div class="idlab" data-i="confRegNum"></div><div class="idval" id="confRegNum">—</div></div>
      <div class="idbox"><div class="idlab" data-i="confRefLab"></div><div class="idval ref" id="confRef" style="font-size:18px">—</div></div>
    </div>
    <p class="mut" id="confWhen"></p>
    <div class="confQr">
      <img id="confQr" alt="Check-in QR" width="180" height="180">
      <p class="mut" data-i="confQrHint"></p>
    </div>
    <div class="confActs">
      <a class="btn ban" id="confCal" href="#" download="bnb-dive.ics" data-i="confCal"></a>
      <a class="btn" id="confWa" href="#" data-i="confShare"></a>
      <button type="button" class="ghost" id="confCopy" data-i="confCopy"></button>
    </div>
    <p class="okmsg hide" id="confCopied" data-i="confCopied"></p>
    <div id="confList"></div>
    <p data-i="fNext"></p>
    <p><a class="btn" href="./" data-i="fBack"></a></p>
  </section>

  <!-- correction request -->
  <section class="card hide" id="corrCard">
    <h2 data-i="corrH"></h2>
    <p class="mut" data-i="corrSub"></p>
    <label for="cRef" data-i="corrRef"></label><input id="cRef" placeholder="BNB-2026-XXXXXX">
    <label for="cPhone" data-i="phone"></label><input id="cPhone" type="tel" inputmode="tel">

function bindExtraPad(canvas){

function sizePad(){
  const r = pad.getBoundingClientRect(), img = signed ? pad.toDataURL() : null;
  pad.width = Math.round(r.width * 2); pad.height = 360;
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, pad.width, pad.height);
  ctx.strokeStyle = "#0a2533"; ctx.lineWidth = 4; ctx.lineCap = "round";
  if (img) { const i = new Image(); i.onload = () => ctx.drawImage(i, 0, 0, pad.width, pad.height); i.src = img; }
}
function pos(e){ const r = pad.getBoundingClientRect(); return { x: (e.clientX - r.left) * pad.width / r.width, y: (e.clientY - r.top) * pad.height / r.height }; }
pad.addEventListener("pointerdown", e => { drawing = true; signed = true; pad.setPointerCapture(e.pointerId); const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); tracker(); });
pad.addEventListener("pointermove", e => { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
pad.addEventListener("pointerup", () => { drawing = false; tracker(); });
$("clearPad").onclick = () => { signed = false; ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, pad.width, pad.height); tracker(); };

function paintConfirm(out, trip){
  const t = T[L];
  lastConfirm = { ...out, ...trip };
  submittedRef = out.ref;
  $("confBooking").textContent = out.bookingId ? String(out.bookingId) : "—";
  $("confRegNum").textContent = out.registrationNumber || "—";

  $("confWhen").textContent = (out.submittedAt ? new Date(out.submittedAt).toLocaleString(L === "es" ? "es" : "en") : "")
    + (whenBits ? ` · ${whenBits}` : "")
    + (trip.activity ? ` · ${trip.activity}` : "");
  const qrPayload = [
    "BANANA NUT BURGER",
    out.bookingId ? `BOOKING:${out.bookingId}` : "",
    out.registrationNumber ? `REG:${out.registrationNumber}` : "",
    out.ref ? `REF:${out.ref}` : "",
    whenBits,
    trip.activity || ""
  ].filter(Boolean).join("|");
  $("confQr").src = "https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=8&data=" + encodeURIComponent(qrPayload);
  $("confQr").alt = qrPayload;
  // ICS calendar
  const ics = buildIcs(trip, out);
  $("confCal").href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  $("confCal").download = `bnb-${out.bookingId || out.ref || "dive"}.ics`;
  const share = (L === "es"
    ? `Banana Nut Burger — mi check-in\nReserva #${out.bookingId || "—"}\nRegistro ${out.registrationNumber || "—"}\nRef ${out.ref}\n${whenBits} ${trip.activity || ""}`
    : `Banana Nut Burger — my check-in\nBooking #${out.bookingId || "—"}\nRegistration ${out.registrationNumber || "—"}\nRef ${out.ref}\n${whenBits} ${trip.activity || ""}`);
  $("confWa").href = "https://wa.me/?text=" + encodeURIComponent(share);
  $("confList").innerHTML = `<ul class="track">${[["trActivity",true],["trDiver",true],["trForms",true],["trWaivers",true],["trSafety",true]].map(([k]) => `<li><span>${t[k]}</span><span class="st done">${t.stDone}</span></li>`).join("")}<li><span>${t.trReview}</span><span class="st wait">${t.statusAwait}</span></li></ul>`;
  $("cRef").value = out.ref || "";
  try { localStorage.setItem("bnb_reg_number", out.registrationNumber || ""); localStorage.setItem("bnb_last_confirm", JSON.stringify(lastConfirm)); } catch (e) {}
}
function buildIcs(trip, out){
  const title = `BNB Dive · ${trip.activity || "Dive"}`;
  const desc = `Booking #${out.bookingId || ""} · Reg ${out.registrationNumber || ""} · Ref ${out.ref || ""}`.replace(/\n/g, "\\n");
  let dtStart = "", dtEnd = "";
  try {
    const map = { "8:00 AM":[8,0], "10:00 AM":[10,0], "1:00 PM":[13,0], "4:00 PM":[16,0], "5:00 PM":[17,0] };
    const hm = map[trip.plannedTime] || [9, 0];
    const [y, m, d] = (trip.plannedDate || "").split("-").map(Number);
    if (y) {
      const pad = n => String(n).padStart(2, "0");
      dtStart = `${y}${pad(m)}${pad(d)}T${pad(hm[0])}${pad(hm[1])}00`;
      const endH = hm[0] + 3;
      dtEnd = `${y}${pad(m)}${pad(d)}T${pad(endH)}${pad(hm[1])}00`;
    }
  } catch (e) {}
  const now = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  return [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Banana Nut Burger//Check-in//EN",
    "BEGIN:VEVENT",
    `UID:${out.ref || out.bookingId || now}@banananutburger`,
    `DTSTAMP:${now}`,
    dtStart ? `DTSTART:${dtStart}` : "",
    dtEnd ? `DTEND:${dtEnd}` : "",
    `SUMMARY:${title}`,
    `DESCRIPTION:${desc}`,
    "LOCATION:Banana Nut Burgers Dive Shop, West End, Roatan",
    "END:VEVENT", "END:VCALENDAR"
  ].filter(Boolean).join("\r\n");
}

$("submitBtn").onclick = async () => {
  syncMedUI();
  const t = T[L], d = collect(), missing = [];
  if (!d.activity || !d.plannedDate || !d.plannedTime) missing.push({ label: t.trActivity, step: 1 });
  if (!d.firstName || !d.lastName || !d.dob) missing.push({ label: t.trDiver, step: 2 });
  if (!packetCompleted) missing.push({ label: t.trForms, step: 3 });
  if (!diverSetsReady()) missing.push({ label: t.needDiverSet, step: 4 });
  if (!$("cbDecl").checked || !signed) missing.push({ label: t.trWaivers, step: 4 });
  if (!medicalDone(d)) missing.push({ label: t.trSafety, step: 5 });
  if (missing.length) {
    $("err6").innerHTML = t.missing + missing.map(m =>
      `<button type="button" class="misslink" data-go="${m.step}">${esc(m.label)}</button>`
    ).join(", ");
    $("err6").querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(Number(b.dataset.go)));
    go(missing[0].step);
    return;
  }
  $("submitBtn").disabled = true; $("submitBtn").textContent = t.sending;
  try {
    const r = await fetch("/api/register", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
      ...d, accuracyDeclaration: $("cbDecl").checked, privacyAck: $("cbPriv").checked, marketingConsent: $("cbMkt").checked,
      signerName: V("signer"), signatureDataUrl: pad.toDataURL("image/png"), hp: V("hp"),
      diverSignatures: [...document.querySelectorAll("#diverSets canvas.diverpad")].map(c => c.dataset.signed === "1" ? c.toDataURL("image/png") : ""),
      medicalFromPacket: !!(packetCompleted && medicalFromPacket),
      packetNeedsPhysician: !!packetNeedsPhysician,
      idempotencyKey: draft.idempotencyKey, draftRef: draft.ref || "", draftToken: draft.token || ""
    })});
    const out = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(out.error || out.detail || "failed");
    paintConfirm(out, { activity: d.activity, plannedDate: d.plannedDate, plannedTime: d.plannedTime });
    draft = { idempotencyKey: draft.idempotencyKey }; saveLocal();
    go(7);
  } catch(e) {
    await saveDraft();
    const msg = e.message && e.message !== "failed" ? e.message : t.failed;
    const low = String(msg).toLowerCase();
    let fixStep = 6;
    if (/name|dob|birth|nombre|nacimiento/.test(low)) fixStep = 2;
    else if (/form|packet|turnstile|consent|signature|firma/.test(low)) fixStep = /signature|firma|declar/.test(low) ? 4 : 3;
    else if (/medic|pregnant|safety/.test(low)) fixStep = 5;
    $("err6").innerHTML = `${esc(msg)} · <button type="button" class="misslink" data-go="${fixStep}">${L==="es"?"Corregir":"Fix"}</button>`;
    $("err6").querySelector("[data-go]").onclick = () => go(fixStep);
    $("submitBtn").disabled = false; $("submitBtn").textContent = t.submit;
    if (fixStep !== 6) go(fixStep);
  }
};

const TIMES = [[8,"8:00 AM"],[10,"10:00 AM"],[13,"1:00 PM"],[16,"4:00 PM"],[17,"5:00 PM"]];
let calCur = new Date(); calCur.setDate(1); let selDate = "", selTime = "";
const isoD = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const monthKey = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
async function loadAvail(month){
  if (availCache[month]?._loaded) return availCache[month];
  try {
    const r = await fetch("/api/availability?month=" + encodeURIComponent(month));
    const out = await r.json().catch(() => ({}));
    if (r.ok) {
      availSlotCap = out.slotCap || 8;
      availCache[month] = { days: out.days || {}, slots: out.slots || {}, dayCap: out.dayCap || availSlotCap * 5, _loaded: true };
      return availCache[month];
    }
  } catch (e) {}
  availCache[month] = { days: {}, slots: {}, dayCap: availSlotCap * 5, _loaded: true };
  return availCache[month];
}
function slotTaken(date, timeLabel){
  const m = availCache[date.slice(0, 7)];
  if (!m) return 0;
  return m.slots[`${date}|${timeLabel}`] || 0;
}
function calState(d){
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  if (x < t) return "off";
  const iso = isoD(d);
  const m = availCache[iso.slice(0, 7)];
  if (!m) return "open";
  const dayN = m.days[iso] || 0;
  const openSlots = TIMES.filter(tm => slotTaken(iso, tm[1]) < availSlotCap).length;
  if (openSlots === 0 || dayN >= (m.dayCap || availSlotCap * 5)) return "off";
  if (openSlots <= 2 || dayN >= availSlotCap * 3) return "low";
  return "open";
}
function renderTimes(){
  const t = T[L], box = $("timeSlots"); box.innerHTML = "";
  if (!selDate) { $("calPick").textContent = ""; $("calPick").classList.remove("picked"); return; }
  let list = TIMES.slice();
  if (selDate === isoD(new Date())) { const h = new Date().getHours(); list = list.filter(x => x[0] > h); }
  list = list.map(x => {
    const taken = slotTaken(selDate, x[1]);
    const left = Math.max(0, availSlotCap - taken);
    return { hour: x[0], label: x[1], left, full: left <= 0 };
  }).filter(x => !x.full || x.label === selTime);
  if (!list.length) { $("calPick").textContent = t.noTimes; $("calPick").classList.remove("picked"); return; }
  if (selTime && !list.some(x => x.label === selTime && !x.full)) selTime = "";
  $("calPick").textContent = selTime ? (selDate + " · " + selTime) : t.pickTime;
  $("calPick").classList.toggle("picked", !!selTime);
  list.forEach(x => {
    const b = document.createElement("button"); b.type = "button";
    const on = selTime === x.label;
    b.className = "tpill" + (on ? " sel" : "") + (x.full ? " off" : "");
    b.disabled = x.full;
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.textContent = x.full ? `${x.label} · ${t.slotFull}` : `${x.label} · ${x.left} ${t.slotLeft}`;
    b.addEventListener("click", e => {
      e.preventDefault(); e.stopPropagation();
      if (x.full) return;
      selTime = x.label;
      if ($("pdate")) $("pdate").value = selDate;
      draft.plannedDate = selDate; draft.plannedTime = selTime; saveLocal();
      renderTimes();
    });
    box.append(b);
  });
}
async function renderCal(){
  const y = calCur.getFullYear(), m = calCur.getMonth(), now = new Date();
  $("calTitle").textContent = calCur.toLocaleDateString(L === "es" ? "es" : "en", { month: "long", year: "numeric" });
  $("calPrev").disabled = (y === now.getFullYear() && m === now.getMonth());
  const mx = new Date(now.getFullYear(), now.getMonth() + 6, 1);
  $("calNext").disabled = (y === mx.getFullYear() && m === mx.getMonth());
  await loadAvail(monthKey(calCur));
  const grid = $("calGrid"); grid.innerHTML = "";
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  for (let i = 0; i < first; i++) { const s = document.createElement("span"); s.className = "calblank"; grid.append(s); }
  for (let d = 1; d <= days; d++) {
    const dt = new Date(y, m, d), st = calState(dt), b = document.createElement("button");
    b.type = "button"; b.textContent = d; b.className = "calday " + st + (selDate === isoD(dt) ? " sel" : "");
    b.disabled = st === "off"; b.setAttribute("aria-label", isoD(dt));
    b.onclick = () => { selDate = isoD(dt); selTime = ""; $("pdate").value = selDate; renderCal(); };
    grid.append(b);
  }
  renderTimes();
}
$("calPrev").onclick = () => { calCur = new Date(calCur.getFullYear(), calCur.getMonth() - 1, 1); renderCal(); };
$("calNext").onclick = () => { calCur = new Date(calCur.getFullYear(), calCur.getMonth() + 1, 1); renderCal(); };
