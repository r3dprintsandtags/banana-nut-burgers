<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Digital Dive Check-In · Banana Nut Burgers Dive Shop</title>
<meta name="description" content="Complete your Banana Nut Burgers dive registration before arrival: guided check-in, forms, electronic signature, and confirmation.">
<link rel="icon" href="/img/bnb-logo.png" type="image/png">
<style>
:root{
  --bg:#fff8e6;--surface:#ffffff;--text:#0a2533;--muted:#3d5160;--border:#8a7348;--line:#d8cba8;
  --primary:#075a78;--primary-text:#ffffff;--danger:#9b1c1c;--ok:#0b5c34;--ban:#ffc928;--ban-text:#0a2533;
  --field:#ffffff;--field-text:#0a2533;--soft:#f7f3e6;--disabled:#d5dee4;--disabled-text:#0a2533;--on-photo:#f4fbff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#06161f;--surface:#123041;--text:#f5fbff;--muted:#d5e4ee;--border:#8eb4c8;--line:#3d6378;
    --primary:#8fd4f0;--primary-text:#06202b;--danger:#ffb4b4;--ok:#8be3b0;
    --field:#0b2230;--field-text:#f5fbff;--soft:#0e2836;--disabled:#2c4a5c;--disabled-text:#f5fbff;
  }
}
*{box-sizing:border-box}
html{overflow-y:scroll;-webkit-overflow-scrolling:touch}
body{margin:0;background:#06161f url(img/reef-swim.jpg) center/cover fixed no-repeat;color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));overflow-x:hidden;min-height:100%}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(6,22,31,.5) 0%,rgba(6,22,31,.72) 40%,rgba(6,22,31,.9) 100%)}
.wrap,.top{position:relative;z-index:1}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0;max-width:760px;margin:0 auto}
.top button{background:rgba(255,255,255,.92);color:#0a2533;border:1px solid rgba(255,255,255,.4);border-radius:99px;min-height:48px;min-width:48px;padding:8px 14px;font-weight:700;cursor:pointer}
.brand{display:inline-flex;align-items:center;text-decoration:none;line-height:0}.brand img{width:88px;height:88px;border-radius:50%;object-fit:cover;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.45))}
h1{font-size:28px;margin:14px 0 4px;color:var(--on-photo);text-shadow:0 2px 14px rgba(0,0,0,.5)}
h2{font-size:26px;line-height:1.2;margin:0 0 6px}
h3{font-size:17px;margin:16px 0 6px}
.lead{color:var(--on-photo);text-shadow:0 1px 8px rgba(0,0,0,.5);margin:0 0 8px}
.card{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin-top:14px;box-shadow:0 16px 48px rgba(0,0,0,.22)}
.card .instr{color:var(--muted);margin:0 0 12px}
label{display:block;font-weight:700;margin-top:14px;font-size:16px;line-height:1.35}
input,select,textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--field);color:var(--field-text);min-height:48px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.row{grid-template-columns:1fr}}
button,.btn{font:inherit;cursor:pointer;border:1px solid transparent;border-radius:14px;padding:12px 18px;background:var(--primary);color:var(--primary-text);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
button:disabled{background:var(--disabled);color:var(--disabled-text);cursor:not-allowed}
.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.ban{background:var(--ban);color:var(--ban-text)}
.linkbtn{background:none;border:0;color:var(--text);text-decoration:underline;font-weight:700;padding:12px 4px}
.wide{width:100%}
.hide{display:none!important}
.mut{color:var(--muted);font-size:14px}
.err{color:var(--danger);font-weight:700;font-size:15px;min-height:20px}
.okmsg{color:var(--ok);font-weight:700;font-size:14px}
.chk{display:flex;gap:12px;align-items:flex-start;font-weight:600;margin-top:12px;min-height:48px;padding:10px 0}
.chk input{width:24px;min-height:24px;height:24px;flex:none;margin-top:2px;accent-color:var(--primary)}
.decl{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--soft);margin-top:10px}
.bad{outline:3px solid var(--danger)}
.chip{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:13px;font-weight:800;border:1px solid;border-radius:999px;padding:3px 10px}
.st-not_started{color:#33434f!important;background:#eef2f5;border-color:#33434f}
.st-in_progress{color:#6b4200!important;background:#fff1d6;border-color:#6b4200}
.st-done{color:#0b5c34!important;background:#e3f5ea;border-color:#0b5c34}
.st-needs_resign{color:#8f1a1a!important;background:#fde4e4;border-color:#8f1a1a}
.st-waiting_shop{color:#33377f!important;background:#e8e9fb;border-color:#33377f}
@media (prefers-color-scheme: dark){
  .st-not_started{color:#d5e4ee!important;background:#1d3442;border-color:#d5e4ee}
  .st-in_progress{color:#ffd58a!important;background:#3a2c10;border-color:#ffd58a}
  .st-done{color:#8be3b0!important;background:#12352a;border-color:#8be3b0}
  .st-needs_resign{color:#ffb4b4!important;background:#3d1717;border-color:#ffb4b4}
  .st-waiting_shop{color:#c7c9ff!important;background:#23264d;border-color:#c7c9ff}
}
#stepper{display:flex;flex-direction:column;align-items:stretch;gap:8px;margin:12px 0 0;overflow:visible}
#stepper button{width:100%;flex-direction:row;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;min-height:56px;background:var(--surface);color:var(--text);border:1px solid var(--line);font-size:17px;line-height:1.25;text-align:left}
#stepper button > span:first-child{flex:1;min-width:0;font-weight:800}
#stepper button[aria-current="step"]{min-height:76px;font-size:22px;padding:16px 16px;outline:3px solid var(--ban);outline-offset:2px}
#stepper button.locked{background:var(--disabled);color:var(--disabled-text)}
#stepper .chip{font-size:13px;padding:4px 10px}
.switcher{flex-wrap:wrap;overflow:visible}
.switcher button{flex:1 1 9.5rem;min-height:52px;font-size:16px;padding:10px 14px}
.switcher button[aria-pressed="true"]{min-height:64px;font-size:18px;padding:12px 16px}
#lockMsg{margin:8px 0 0;padding:10px 12px;border-radius:12px;background:var(--surface);color:var(--danger);font-weight:700}
.switcher{display:flex;flex-wrap:wrap;gap:8px;overflow:visible;padding:2px 0 8px;margin:0 0 8px}
.switcher button{flex:1 1 9.5rem;background:var(--surface);color:var(--text);border:1px solid var(--border);gap:8px}
.switcher button[aria-pressed="true"]{outline:3px solid var(--primary);outline-offset:1px}
.yesbig{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.yesbig button{min-height:64px;font-size:18px;background:var(--surface);color:var(--text);border:2px solid var(--border)}
.yesbig button[aria-pressed="true"]{background:var(--primary);color:var(--primary-text);border-color:var(--primary)}
.person{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;background:var(--soft)}
.person .top2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.person .checks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.person .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.allset{margin-top:12px;padding:14px;border-radius:12px;border:2px solid var(--ok);color:var(--ok);font-weight:800;background:var(--surface)}
iframe.embed{width:100%;border:0;display:block;min-height:70vh;height:70vh;background:#fff8e6;border-radius:16px;overflow:hidden}
.doclist{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.docline{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;max-width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--soft)}
.docline b{min-width:0;flex:1 1 8rem;overflow-wrap:anywhere}
.docline .docacts{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.docline .docacts button{flex:1 1 auto;min-width:0;padding:10px 12px}
@media(max-width:520px){.docline{flex-direction:column;align-items:stretch}.docline .docacts{width:100%;margin-left:0}.docline .docacts button{flex:1}}
.reason{color:var(--danger);font-weight:700;font-size:14px;margin:4px 0 0}
.pdfview{margin-top:8px;max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px}
.pdfview canvas{width:100%;height:auto;display:block;margin:0 0 8px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:8px}
@media(min-width:900px){
  .wrap,.top{max-width:1080px}
  .bar .in{max-width:1080px}
  .card{padding:28px 32px}
  h2{font-size:32px}
  #stepper{flex-direction:row}
  #stepper button{flex:1;width:auto;flex-direction:column;justify-content:center;text-align:center;min-width:0;min-height:108px;font-size:17px;padding:14px 10px}
  #stepper button > span:first-child{flex:none}
  #stepper button[aria-current="step"]{flex:1.8;min-height:132px;font-size:26px;padding:16px 12px}
  #stepper .chip{font-size:13px;white-space:normal;text-align:center}
  .switcher button[aria-pressed="true"]{min-height:72px;font-size:20px}
  label{font-size:17px}
}
.bar .in button{flex:1}
.bar #backBtn{flex:0 0 auto;min-width:96px}
.ref{font-size:26px;font-weight:800;letter-spacing:1px;color:var(--text)}
.confIds{display:grid;gap:10px;margin:12px 0}.confIds .idbox{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--soft);text-align:center}
.confIds .idlab{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}.confIds .idval{font-size:22px;font-weight:800;color:var(--text);letter-spacing:1px;word-break:break-all}
.confQr{display:flex;flex-direction:column;align-items:center;gap:8px;margin:14px 0}.confQr img{width:180px;height:180px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.confActs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.confActs a,.confActs button{flex:1;min-width:140px}
.pill{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--ban);color:var(--ban-text)}
.cal{border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:6px;background:var(--surface)}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.calhead b{font-size:18px;letter-spacing:2px;text-transform:uppercase}
.calnav{width:48px;min-height:48px;padding:0;border-radius:10px;background:var(--surface);color:var(--text);border:1.5px solid var(--text);font-size:22px;line-height:1}
.caldow,.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.caldow span{text-align:center;font-size:12px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;padding:4px 0}
.calday{min-height:48px;padding:6px 0;border-radius:9px;font-weight:600;background:#cdeccd;color:#14532d;border:1px solid #9ed69e}
.calday.low{background:#fdf0b8;color:#713f12;border-color:#ecd97a}
.calday.off{background:#f6cfcf;color:#7f1d1d;border-color:#edaeae;cursor:not-allowed}
.calday.sel{background:#1d4ed8;color:#fff;border-color:#1e3a8a}
.calblank{min-height:48px}.callegend{font-size:13px;margin:10px 0 0}
.times{display:flex;flex-wrap:wrap;gap:8px}
.tpill{min-height:48px;padding:10px 18px;border-radius:99px;background:var(--surface);color:var(--text);border:1.5px solid var(--text)}
.tpill.sel,.tpill[aria-pressed="true"]{background:#1d4ed8;color:#fff;border-color:#1e3a8a}
.tpill.off{text-decoration:line-through}
.yesno{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.yesno label{margin-top:0;display:flex;gap:8px;align-items:center;min-height:48px;padding:10px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer;font-weight:600}
.yesno input{width:22px;min-height:22px;height:22px;margin:0;accent-color:var(--primary)}
#kioskWarn{position:relative;z-index:2;max-width:760px;margin:8px auto;padding:10px 14px;background:var(--surface);border-radius:12px}
</style>
</head>
<body>
<div class="top">
  <a class="brand" href="/" aria-label="Banana Nut Burgers home">
    <img src="/img/bnb-logo.png" width="88" height="88" alt="Banana Nut Burgers Dive Shop">
  </a>
  <button id="langBtn" type="button">ES</button>
</div>
<div class="wrap">
  <h1>🤿 <span data-i="h1"></span></h1>
  <p class="lead" data-i="sub"></p>
  <nav id="stepper" class="hide" aria-label="Progress"></nav>
  <p id="lockMsg" class="hide" role="status" aria-live="polite"></p>

  <!-- landing -->
  <section class="card" data-step="landing">
    <h2 data-i="aH"></h2>
    <p data-i="aP1"></p><p data-i="aP2"></p>
    <div id="requirements"><b data-i="reqH"></b><p class="mut" data-i="reqP"></p></div>
    <p class="mut"><span data-i="priv"></span></p>
    <p class="mut"><span data-i="help"></span> <a href="https://wa.me/50498763374">WhatsApp +504 9876-3374</a> · <a href="mailto:banananutburgers@gmail.com">banananutburgers@gmail.com</a></p>
    <p><button type="button" id="startBtn" class="ban wide" style="font-size:18px" data-i="start"></button></p>
    <p><button type="button" class="ghost" id="resumeOpen" data-i="resumeOpen"></button>
       <button type="button" class="ghost" id="corrBtn" data-i="corrOpen"></button></p>
    <div id="resumePanel" class="hide">
      <label for="rRef" data-i="corrRef"></label><input id="rRef" placeholder="BNB-2026-XXXXXX">
      <label for="rTok" data-i="resumeCode"></label><input id="rTok" autocomplete="off">
      <p class="err" id="resumeErr" aria-live="polite"></p>
      <p><button type="button" id="resumeBtn" data-i="resumeBtn"></button></p>
      <p class="mut" data-i="resumeNote"></p>
    </div>
  </section>

  <!-- 1 About you: activity, time, your details, address, emergency contact, declarations -->
  <section class="card hide" data-step="about">
    <h2 data-i="stAbout"></h2>
    <p class="instr" data-i="aboutInstr"></p>
    <p class="mut" data-i="oneAdultNote"></p>
    <label for="act" data-i="activity"></label><select id="act"><option value="" id="actPh"></option></select>
    <label data-i="pdate"></label>
    <div class="cal" id="cal">
      <div class="calhead">
        <button type="button" class="calnav" id="calPrev" aria-label="Previous month">‹</button>
        <b id="calTitle"></b>
        <button type="button" class="calnav" id="calNext" aria-label="Next month">›</button>
      </div>
      <div class="caldow"><span data-i="sun"></span><span data-i="mon"></span><span data-i="tue"></span><span data-i="wed"></span><span data-i="thu"></span><span data-i="fri"></span><span data-i="sat"></span></div>
      <div class="calgrid" id="calGrid"></div>
      <p class="callegend" data-i="calLegend"></p>
      <p class="mut" id="calPick"></p>
      <label data-i="availTimes"></label>
      <div class="times" id="timeSlots"></div>
    </div>
    <input type="hidden" id="pdate">
    <label data-i="courseQ"></label>
    <div class="yesno">
      <label><input type="radio" name="course" id="courseYes" value="yes"><span data-i="yes"></span></label>
      <label><input type="radio" name="course" id="courseNo" value="no"><span data-i="no"></span></label>
    </div>
    <label for="bref" data-i="bref"></label><input id="bref" autocomplete="off">

    <h3 data-i="bH"></h3>
    <div class="row">
      <div><label for="fn" data-i="first"></label><input id="fn" autocomplete="given-name"></div>
      <div><label for="ln" data-i="last"></label><input id="ln" autocomplete="family-name"></div>
    </div>
    <label for="pn" data-i="pref"></label><input id="pn" autocomplete="nickname">
    <div class="row">
      <div><label for="ph" data-i="phone"></label><input id="ph" type="tel" autocomplete="tel" inputmode="tel"></div>
      <div><label for="em" data-i="email"></label><input id="em" type="email" autocomplete="email"></div>
    </div>
    <label for="plang" data-i="plang"></label><select id="plang"><option value="en">English</option><option value="es">Español</option></select>
    <label for="dob" data-i="dob"></label><input id="dob" type="date" autocomplete="bday">
    <label for="addr" data-i="addr"></label><input id="addr" autocomplete="street-address">
    <div class="row">
      <div><label for="city" data-i="city"></label><input id="city" autocomplete="address-level2"></div>
      <div><label for="state" data-i="state"></label><input id="state" autocomplete="address-level1"></div>
    </div>
    <label for="zip" data-i="zip"></label><input id="zip" autocomplete="postal-code">
    <label data-i="ownGear"></label>
    <div class="yesno">
      <label><input type="radio" name="ownGear" id="gearYes" value="yes"><span data-i="yes"></span></label>
      <label><input type="radio" name="ownGear" id="gearNo" value="no"><span data-i="no"></span></label>
    </div>
    <div id="gearSizeWrap" class="hide">
      <label for="gearSize" data-i="gearSize"></label>
      <select id="gearSize">
        <option value="" data-i="sel"></option>
        <option value="XS">XS</option><option value="S">S</option><option value="M">M</option>
        <option value="L">L</option><option value="XL">XL</option><option value="XXL">XXL</option>
      </select>
      <label for="gearNote" data-i="gearNote"></label>
      <input id="gearNote" autocomplete="off" data-p="gearNotePh">
    </div>
    <div class="row">
      <div><label for="cert" data-i="cert"></label><select id="cert">
        <option value="" data-i="sel"></option><option value="None">None</option><option value="Open Water">Open Water</option>
        <option value="Advanced Open Water">Advanced Open Water</option><option value="Rescue">Rescue</option><option value="Other">Other</option></select></div>
      <div><label for="logged" data-i="logged"></label><input id="logged" type="number" min="0" inputmode="numeric"></div>
    </div>
    <label for="lastdive" data-i="lastdive"></label><input id="lastdive" type="date">
    <h3 data-i="emgH"></h3>
    <label for="en" data-i="emgName"></label><input id="en" autocomplete="off">
    <div class="row">
      <div><label for="erel" data-i="emgRel"></label><input id="erel" autocomplete="off"></div>
      <div><label for="ep" data-i="emgPhone"></label><input id="ep" type="tel" inputmode="tel"></div>
    </div>
    <label for="notes" data-i="notes"></label><textarea id="notes" rows="2"></textarea>
    <div class="decl"><b id="declTitle"></b><p id="declText"></p>
      <label class="chk"><input type="checkbox" id="cbDecl"><span id="declCheck"></span></label></div>
    <div class="decl"><p id="privText"></p>
      <label class="chk"><input type="checkbox" id="cbPriv"><span data-i="privCheck"></span></label></div>
    <div class="decl"><p id="mktText"></p>
      <label class="chk"><input type="checkbox" id="cbMkt"><span data-i="mktCheck"></span></label></div>
    <p class="okmsg" id="draftMsg" aria-live="polite"></p>
    <p class="err" id="errAbout" aria-live="polite"></p>
  </section>

  <!-- 2 Who's coming -->
  <section class="card hide" data-step="minors">
    <h2 data-i="stMinors"></h2>
    <p class="instr" data-i="minorsQ"></p>
    <div class="yesbig" role="group">
      <button type="button" id="hasMinorsYes" aria-pressed="false" data-i="yes"></button>
      <button type="button" id="hasMinorsNo" aria-pressed="false" data-i="noJustMe"></button>
    </div>
    <p class="mut" data-i="minorsLine"></p>
    <div id="minorsBox" class="hide">
      <div id="minorList"></div>
      <p class="mut" id="sameLine" data-i="sameLine"></p>
      <div id="addChildBox" class="decl">
        <h3 data-i="addChildH" style="margin-top:0"></h3>
        <div class="row">
          <div><label for="pFirst" data-i="first"></label><input id="pFirst" autocomplete="off"></div>
          <div><label for="pLast" data-i="last"></label><input id="pLast" autocomplete="off"></div>
        </div>
        <label for="pDob" data-i="dob"></label><input id="pDob" type="date">
        <p class="err" id="pDobErr" aria-live="polite"></p>
        <label for="pRel" data-i="partyRel"></label>
        <select id="pRel">
          <option value="child" data-i="relChild"></option>
          <option value="grandchild" data-i="relGrand"></option>
          <option value="relative" data-i="relRelative"></option>
          <option value="other" data-i="relOther"></option>
        </select>
        <p class="err" id="partyAddErr" aria-live="polite"></p>
        <div class="acts" style="margin-top:10px">
          <button type="button" class="ban" id="partySavePerson" data-i="addChild"></button>
          <button type="button" class="ghost" id="partyCancelAdd" data-i="remove"></button>
        </div>
      </div>
      <p><button type="button" class="ghost wide hide" id="addAnotherBtn" data-i="addAnother"></button></p>

/* ---------- saving ---------- */
let saveTimer = null, statusTimer = null, savingNow = null, flowGen = 0;
function setSaveState(kind){

  el.textContent = kind === "saving" ? t().saving : kind === "ok" ? t().savedOk : kind === "fail" ? t().notSaved : "";
  el.style.color = kind === "fail" ? "var(--danger)" : "";

function scheduleSave(){

async function saveDraft(show){
  clearTimeout(saveTimer);

  if (!d.firstName || !d.lastName || d.phone.replace(/\D/g, "").length < 8) return false;
  if (savingNow) await savingNow;
  if (gen !== flowGen) return false;
  setSaveState("saving");
  savingNow = (async () => {
    const post = async (body) => {
      const r = await fetch("/api/register/draft", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const out = await r.json().catch(() => ({}));
      return { r, out };
    };
    try {
      let creating = !(draft.ref && draft.token);
      let { r, out } = await post(creating ? { data: d } : { ref: draft.ref, token: draft.token, data: d });
      // A saved code from an older visit is gone. Drop it and create a new draft.
      if (!r.ok && (r.status === 404 || r.status === 401) && !creating) {
        draft.ref = ""; draft.token = ""; saveLocal();
        creating = true;
        ({ r, out } = await post({ data: d }));
      }
      if (gen !== flowGen) return false;
      if (r.ok && out.ref) {
        draft.ref = out.ref; if (out.token) draft.token = out.token; saveLocal();
        if (creating && out.prior) {
          const cur = collect(), merge = {};
          Object.entries(out.prior).forEach(([k, v]) => { if (v && !cur[k]) merge[k] = v; });
          if (Object.keys(merge).length) fill({ ...cur, ...merge });
        }
        if (creating) $("draftMsg").textContent = (out.returning ? t().returning + " · " : "") + `${t().saved}: ${out.ref} · ${t().resumeCode.replace(" *", "")}: ${draft.token}`;
        setSaveState("ok");

        return true;
      }
      setSaveState("fail");
      return false;
    } catch (e) { if (gen === flowGen) setSaveState("fail"); return false; }
  })();

  savingNow = null;

}
function scheduleStatus(){ clearTimeout(statusTimer); statusTimer = setTimeout(refreshStatus, 400); }
async function refreshStatus(){
  const gen = flowGen;

  try {
    const r = await fetch(`/api/register/participants?ref=${encodeURIComponent(draft.ref)}&token=${encodeURIComponent(draft.token)}&lang=${L}`);
    const out = await r.json().catch(() => ({}));
    if (gen !== flowGen) return null;
    if (!r.ok) {
      if (r.status === 404 || r.status === 401) { draft.ref = ""; draft.token = ""; saveLocal(); status = null; }
      else if (out.code === "GUARDIAN_REQUIRED" && $("errAbout")) $("errAbout").textContent = t().needGuardianFirst;

/* ---------- navigation (Back keeps everything: all data is saved server-side) ---------- */
function hashFor(id, pid){ return "#" + id + (pid ? ":" + pid : ""); }
function go(id, pid, opts){

  personId = pid || null;

  document.querySelectorAll("[data-step]").forEach(s => s.classList.toggle("hide", s.dataset.step !== id));
  $("lockMsg").classList.add("hide");

      e.preventDefault(); e.stopPropagation();
      if (v.full) return;
      selTime = v.label; $("pdate").value = selDate;
      draft.plannedDate = selDate; draft.plannedTime = selTime; saveLocal();
      renderTimes(); scheduleSave();
    });
    box.append(b);
  });
}
async function renderCal(){
  const y = calCur.getFullYear(), m = calCur.getMonth(), now = new Date();
  $("calTitle").textContent = calCur.toLocaleDateString(L === "es" ? "es" : "en", { month: "long", year: "numeric" });
  $("calPrev").disabled = (y === now.getFullYear() && m === now.getMonth());
  const mx = new Date(now.getFullYear(), now.getMonth() + 6, 1);
  $("calNext").disabled = (y === mx.getFullYear() && m === mx.getMonth());
  await loadAvail(monthKey(calCur));
  const grid = $("calGrid"); grid.innerHTML = "";
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  for (let i = 0; i < first; i++) { const s = document.createElement("span"); s.className = "calblank"; grid.append(s); }
  for (let d = 1; d <= days; d++) {
    const dt = new Date(y, m, d), st = calState(dt), b = document.createElement("button");
    b.type = "button"; b.textContent = d; b.className = "calday " + st + (selDate === isoD(dt) ? " sel" : "");
    b.disabled = st === "off"; b.setAttribute("aria-label", isoD(dt));
    b.onclick = () => { selDate = isoD(dt); selTime = ""; $("pdate").value = selDate; renderCal(); };
    grid.append(b);
  }
  renderTimes();
}
$("calPrev").onclick = () => { calCur = new Date(calCur.getFullYear(), calCur.getMonth() - 1, 1); renderCal(); };
$("calNext").onclick = () => { calCur = new Date(calCur.getFullYear(), calCur.getMonth() + 1, 1); renderCal(); };

/* ---------- kiosk: idle warning, then DOB lock (or clear), then full clear ---------- */
const params = new URLSearchParams(location.search);
kioskMode = kioskMode || params.get("kiosk") === "1";
let kioskLocked = false;
function kioskClearAndRestart(){
  clearDoneIdle();
  clearBrowserPersonalStorage();
  wipePersonalFields();
  resetState({ idempotencyKey: newKey() });
  kioskLocked = false;
  $("dobLockBox").classList.add("hide");
  try { history.replaceState({}, "", "/register.html?kiosk=1"); } catch (e) {}
  announceA11y(t().nextPersonSavedA11y);
  go("landing", null, { replace: true });
}
function showDobLock(){
  const need = V("dob");
  if (!kioskMode || step === "landing" || !/^\d{4}-\d{2}-\d{2}$/.test(need)) return false;
  kioskLocked = true;
  document.querySelectorAll("[data-step]").forEach(s => s.classList.add("hide"));
  $("bar").classList.add("hide"); $("stepper").classList.add("hide");
  $("dobLockBox").classList.remove("hide");
  $("dobLockSub").textContent = fmt(t().dobLockSub, { name: V("fn") });
  $("dobLockInput").value = ""; $("dobLockErr").textContent = "";
  return true;
}
$("dobLockGo").onclick = () => {
  if (V("dobLockInput") !== V("dob")) { $("dobLockErr").textContent = t().dobLockBad; return; }
  kioskLocked = false;
  $("dobLockBox").classList.add("hide");
  go(step, personId, { noHistory: true });
  armKioskIdle();
};
$("dobLockClear").onclick = () => kioskClearAndRestart();
if (kioskMode) {
  const warn = document.createElement("p");
  warn.id = "kioskWarn"; warn.className = "err hide"; warn.dataset.i = "kioskWarn";
  warn.textContent = t().kioskWarn;
  document.body.prepend(warn);
  let idleWarn, idleLock, idleReset;
  armKioskIdle = () => {
    if (kioskLocked || !shopPublic.kioskAutoReset) return;
    clearTimeout(idleWarn); clearTimeout(idleLock); clearTimeout(idleReset);
    warn.classList.add("hide");
    const doneIdle = Math.max(10, Number(shopPublic.kioskDoneIdleSec) || 45);
    idleWarn = setTimeout(() => warn.classList.remove("hide"), Math.max(doneIdle, 60) * 1000);
    idleLock = setTimeout(() => { if (step === "done") return; if (!showDobLock()) kioskClearAndRestart(); }, Math.max(doneIdle + 30, 90) * 1000);
    idleReset = setTimeout(() => { if (step === "done") return; kioskClearAndRestart(); }, Math.max(doneIdle + 60, 120) * 1000);
  };
  ["pointerdown", "keydown", "touchstart"].forEach((ev) => document.addEventListener(ev, () => {
    if (!kioskLocked) armKioskIdle();
    if (step === "done" && shopPublic.kioskAutoReset && $("nextPersonStay").classList.contains("hide")) armDoneIdleReset();
  }, { passive: true }));
  armKioskIdle();
}

/* ---------- start ---------- */
applyLang();
(async () => {
  const actQ = params.get("activity");
  if (actQ && ACTS.includes(actQ)) $("act").value = actQ;
  const bookingQ = params.get("booking");
  if (params.get("fresh") === "1") {
    clearBrowserPersonalStorage();
    resetState({ idempotencyKey: newKey(), bookingRef: bookingQ ? String(bookingQ) : undefined, activity: (actQ && ACTS.includes(actQ)) ? actQ : undefined });
  } else if (bookingQ && !draft.bookingRef) { draft.bookingRef = String(bookingQ); saveLocal(); }
  if (bookingQ) {
    $("bref").value = String(bookingQ);
    try {
      const ctx = await (await fetch("/api/bookings/" + encodeURIComponent(bookingQ) + "/invite-context")).json();
      if (ctx.ok && ctx.booking) {
        if (ctx.booking.activity && ACTS.includes(ctx.booking.activity)) $("act").value = ctx.booking.activity;
        if (ctx.booking.date) { selDate = ctx.booking.date; $("pdate").value = ctx.booking.date; }
        if (ctx.booking.time) selTime = ctx.booking.time;
        renderCal();
        if (!$("inviteBanner")) {
          const note = document.createElement("p"); note.className = "mut"; note.id = "inviteBanner";
          note.textContent = ctx.message || t().oneAdultNote;
          document.querySelector('[data-step="about"] h2').after(note);
        }
      }
    } catch (e) {}
  }
  // Staff links and reminder emails open a saved registration with ?ref=&token=.
  const qRef = params.get("ref"), qTok = params.get("token");
  if (params.get("fresh") !== "1" && qRef && qTok) {
    try { history.replaceState({}, "", location.pathname + (kioskMode ? "?kiosk=1" : "")); } catch (e) {}
    if (await openSaved(qRef, qTok)) return;
  }
  if (draft.plannedDate) { selDate = draft.plannedDate; $("pdate").value = draft.plannedDate; }
  if (draft.plannedTime) selTime = draft.plannedTime;
  try {
    const pre = JSON.parse(localStorage.getItem("bnb_reg_prefill") || "null");
    if (pre) { fill(pre); localStorage.removeItem("bnb_reg_prefill"); }
  } catch (e) {}
  if (location.hash === "#resume") $("resumeOpen").click();
  if (location.hash === "#requirements") setTimeout(() => $("requirements").scrollIntoView({ behavior: "smooth" }), 300);
  // Same device: reopen where this person left off (reload never loses the step).
  if (params.get("fresh") !== "1" && draft.ref && draft.token) {
    if (await openSaved(draft.ref, draft.token)) return;
  }
  if (params.get("start") === "1" || actQ) go("about", null, { replace: true });
  else go("landing", null, { replace: true });
})();
</script>
